<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Life DEX - Premium Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@9.1.0/dist/modal.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    :root {
      --background-base: #0A0F1C;
      --primary-accent: #00FFB3;
      --secondary-accent: #B300FF;
      --highlight-accent: #FFD700;
      --carbon-overlay: #1C1F26;
      --glyph-ring: #44475A;
      --shard-glow: #00FFFF;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: var(--background-base);
      color: #fff;
      min-height: 100vh;
      background-image: repeating-linear-gradient(135deg, var(--carbon-overlay) 0 2px, transparent 2px 20px);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(0, 255, 179, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(179, 0, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
      animation: gradientShift 15s ease infinite;
      z-index: 0;
    }
    @keyframes gradientShift { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
    .header-bar {
      background: var(--carbon-overlay);
      border-bottom: 2px solid var(--primary-accent);
      box-shadow: 0 2px 12px var(--primary-accent);
      padding: 1.5rem 2rem;
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-bar h1 {
      font-size: 2rem; font-weight: bold; letter-spacing: 2px; color: var(--primary-accent);
    }
    .sidebar-nav {
      position: fixed; top: 85px; left: 0; width: 220px; height: calc(100% - 85px);
      background: rgba(28, 31, 38, 0.95);
      border-right: 2px solid var(--glyph-ring);
      display: flex; flex-direction: column; align-items: center; z-index: 50;
      padding: 2rem 1rem; backdrop-filter: blur(12px);
    }
    .sidebar-nav ul { list-style: none; width: 100%; margin-bottom: auto; }
    .sidebar-nav li { margin-bottom: 1rem; }
    .nav-btn {
      width: 100%; padding: 0.75rem 1rem;
      background: var(--carbon-overlay);
      border: 2px solid var(--primary-accent);
      color: var(--primary-accent);
      font-weight: bold; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .nav-btn.active, .nav-btn:hover {
      border-color: var(--secondary-accent);
      color: var(--highlight-accent);
      transform: translateX(5px);
    }
    .glyph-ring {
      width: 80px; height: 80px; border: 4px solid var(--glyph-ring);
      border-radius: 50%;
      animation: rotate 6s linear infinite;
      margin-top: 2rem;
    }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
    .main-panel {
      margin-left: 240px; margin-top: 105px; padding: 2rem;
      min-height: calc(100vh - 105px); position: relative; z-index: 1;
    }
    .glass-card {
      background: rgba(28, 31, 38, 0.9); backdrop-filter: blur(16px);
      border-radius: 16px; margin-bottom: 2rem; padding: 2rem;
      border: 1px solid var(--glyph-ring);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      background: rgba(28, 31, 38, 0.95);
      border-color: var(--primary-accent);
      transform: translateY(-2px);
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;
    }
    .stat-item {
      padding: 1rem; background: rgba(10, 15, 28, 0.6);
      border-radius: 8px; border: 1px solid var(--primary-accent);
    }
    .stat-label { color: var(--highlight-accent); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-number { font-size: 1.5rem; font-weight: bold; }
    .live-pulse { animation: livePulse 2s ease-in-out infinite; }
    @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .btn-primary {
      padding: 0.75rem 2rem; border: none; border-radius: 8px;
      color: white; font-weight: bold; cursor: pointer;
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    input[type="number"], input[type="text"] {
      width: 100%; padding: 0.75rem;
      background: rgba(10, 15, 28, 0.6);
      border: 1px solid var(--primary-accent);
      border-radius: 8px; color: white;
      font-size: 1rem; margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header class="header-bar">
    <h1>🌐 Digital Life DEX</h1>
  </header>

  <nav class="sidebar-nav">
    <ul>
      <li><button class="nav-btn active" data-tab="overview">📊 Overview</button></li>
      <li><button class="nav-btn" data-tab="stake">🔒 Stake</button></li>
      <li><button class="nav-btn" data-tab="my-stakes">💼 My Stakes</button></li>
      <li><button class="nav-btn" data-tab="live-dex">📈 Live DEX</button></li>
    </ul>
    <div class="glyph-ring"></div>
  </nav>

  <main class="main-panel">
    <section class="tab-section" id="overview" style="display:block;">
      <div class="glass-card">
        <h2 style="color: var(--primary-accent); font-size: 1.5rem; margin-bottom: 1.5rem;">📊 Vault Statistics</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <p class="stat-label">Total Value Locked</p>
            <p class="stat-number" id="totalStaked">0.00 WMON</p>
          </div>
          <div class="stat-item">
            <p class="stat-label">Your Balance</p>
            <p class="stat-number" id="walletBalance">0.00 WMON</p>
          </div>
          <div class="stat-item">
            <p class="stat-label">APY</p>
            <p class="stat-number" style="color: var(--primary-accent);">12.5%</p>
          </div>
          <div class="stat-item">
            <p class="stat-label">Total Stakers</p>
            <p class="stat-number" id="totalUsers">0</p>
          </div>
        </div>
      </div>

      <div class="glass-card">
        <h3 style="color: var(--secondary-accent); margin-bottom: 1rem;">🔌 Connect Wallet</h3>
        <button class="btn-primary" id="connectWallet">⏳ Initializing...</button>
        <p id="walletStatus" style="margin-top: 1rem; font-size: 0.9rem; color: var(--glyph-ring);"></p>
      </div>

      <div class="glass-card">
        <h3 style="color: var(--highlight-accent); margin-bottom: 1rem;">📰 Recent Activity</h3>
        <div id="activityFeed">
          <p style="color: var(--glyph-ring); text-align: center; padding: 2rem;">No recent activity</p>
        </div>
      </div>
    </section>

    <section class="tab-section" id="stake" style="display:none;">
      <div class="glass-card">
        <h2 style="color: var(--secondary-accent); margin-bottom: 1.5rem;">🔒 Stake WMON Tokens</h2>
        <label style="display: block; margin-bottom: 0.5rem; color: var(--primary-accent);">Amount to Stake</label>
        <input id="stakeAmount" type="number" placeholder="Enter amount (e.g., 100)" step="0.01" min="0">
        <label style="display: block; margin-bottom: 0.5rem; color: var(--primary-accent);">Lock Duration (days)</label>
        <input id="lockDuration" type="number" placeholder="Enter days (default: 30)" value="30" min="1">
        <label style="display: block; margin-bottom: 0.5rem; color: var(--primary-accent);">Referrer Address (optional)</label>
        <input id="referrerAddress" type="text" placeholder="0x... (optional)">
        <button class="btn-primary" id="stakeBtn">🔒 Stake Now</button>
      </div>
    </section>

    <section class="tab-section" id="my-stakes" style="display:none;">
      <div class="glass-card">
        <h2 style="color: var(--highlight-accent); margin-bottom: 1.5rem;">💼 My Active Stakes</h2>
        <div id="stakesGrid">
          <p style="color: var(--glyph-ring); text-align: center; padding: 2rem;">Connect your wallet to view stakes</p>
        </div>
      </div>
    </section>

    <section class="tab-section" id="live-dex" style="display:none;">
      <div class="glass-card">
        <h2 style="color: var(--shard-glow); margin-bottom: 1.5rem;">📈 Live DEX Data</h2>
        <div id="dexData">
          <p style="color: var(--glyph-ring); text-align: center; padding: 2rem;">Loading DEX data...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const MONAD_CHAIN_ID = 143;
    const MONAD_CHAIN_ID_HEX = "0x8f";
    const VAULT_V2_PROXY = "0x2C18eb6708cb7c03C19c7C793345bd22E9d261b8";
    const WMON_ADDRESS = "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A";
    const RPC_URL = "https://rpc.monad.xyz";
    const WEB3AUTH_CLIENT_ID = "BPi5PB_UiIZ-cPz1GtV5i1I2iOSOHuimiXBI0e-Oe_u6X3oVAbCiAZOTEBtTXw4tsluTITPqA8zMsfxIKMjiqNQ";

    // Simplified ABIs for production use
    const VAULT_ABI = [
      "function stake(address token, uint256 amount, uint256 duration, address referrer) external",
      "function withdraw(uint256 stakeId) external",
      "function getUserStakes(address user) external view returns (uint256[])",
      "function getStakeInfo(address user, uint256 stakeId) external view returns (tuple(address token, uint256 amount, uint256 stakedAt, uint256 unlockTime, uint256 shares, uint256 rewardDebt, address referrer, bool withdrawn, bool autoCompound))",
      "function totalStaked(address token) external view returns (uint256)",
      "function totalUsers() external view returns (uint256)",
      "function claimReferralRewards(address token) external"
    ];

    const WMON_ABI = [
      "function approve(address spender, uint256 amount) public returns (bool)",
      "function allowance(address owner, address spender) public view returns (uint256)",
      "function balanceOf(address account) public view returns (uint256)",
      "function decimals() public view returns (uint8)",
      "function name() public view returns (string)",
      "function symbol() public view returns (string)",
      "function totalSupply() public view returns (uint256)",
      "function transfer(address to, uint256 amount) public returns (bool)"
    ];

    let provider, signer, userAddress, vault, wmon, web3auth, web3authProvider;

    function shortAddr(addr) {
      return addr ? addr.slice(0, 6) + "..." + addr.slice(-4) : "";
    }

    function updateStatus(msg, color = "gray") {
      const statusEl = document.getElementById("walletStatus");
      if (statusEl) {
        statusEl.textContent = msg;
        statusEl.style.color = color === "green" ? "#10b981" : color === "red" ? "#ef4444" : "#9ca3af";
      }
    }

    async function initWeb3Auth() {
      try {
        console.log("🔄 Checking Web3Auth library...");
        
        if (typeof window.Modal === 'undefined' || typeof window.Modal.Web3Auth === 'undefined') {
          throw new Error("Web3Auth Modal library not loaded");
        }

        const chainConfig = {
          chainNamespace: "eip155",
          chainId: MONAD_CHAIN_ID_HEX,
          rpcTarget: RPC_URL,
          displayName: "Monad Mainnet",
          ticker: "MON",
          tickerName: "Monad"
        };

        web3auth = new window.Modal.Web3Auth({
          clientId: WEB3AUTH_CLIENT_ID,
          web3AuthNetwork: "sapphire_devnet",
          chainConfig: chainConfig,
          uiConfig: {
            appName: "Digital Life DEX",
            mode: "dark",
            theme: { primary: "#00FFB3" }
          }
        });

        await web3auth.initModal();
        console.log("✅ Web3Auth initialized");
        return true;
      } catch (error) {
        console.error("❌ Web3Auth init error:", error);
        throw error;
      }
    }

    async function connectWallet() {
      if (!web3auth) {
        alert("Web3Auth not initialized");
        return;
      }

      try {
        addActivityFeedItem("🔄", "Connecting", "Opening login...", "yellow");
        
        web3authProvider = await web3auth.connect();
        if (!web3authProvider) throw new Error("Connection failed");

        provider = new ethers.BrowserProvider(web3authProvider);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        vault = new ethers.Contract(VAULT_V2_PROXY, VAULT_ABI, signer);
        wmon = new ethers.Contract(WMON_ADDRESS, WMON_ABI, signer);

        const connectBtn = document.getElementById("connectWallet");
        connectBtn.textContent = "✅ " + shortAddr(userAddress);
        connectBtn.onclick = disconnectWallet;

        updateStatus("Connected: " + shortAddr(userAddress), "green");

        await Promise.all([
          updateWalletBalance(),
          updateUserStakes(),
          fetchLiveDexData()
        ]);

        addActivityFeedItem("🔌", "Connected", shortAddr(userAddress), "green");
      } catch (err) {
        console.error("Connection error:", err);
        if (!err.message.includes("User closed")) {
          alert("Connection failed: " + err.message);
          addActivityFeedItem("❌", "Failed", err.message, "red");
        }
      }
    }

    async function disconnectWallet() {
      try {
        if (web3auth && web3auth.connected) {
          await web3auth.logout();
        }
        
        userAddress = null;
        provider = null;
        signer = null;
        vault = null;
        wmon = null;

        const connectBtn = document.getElementById("connectWallet");
        connectBtn.textContent = "Connect Wallet";
        connectBtn.onclick = connectWallet;

        updateStatus("Disconnected", "gray");
        document.getElementById("walletBalance").textContent = "0.00 WMON";

        addActivityFeedItem("🔌", "Disconnected", "Logged out", "green");
      } catch (err) {
        console.error("Disconnect error:", err);
      }
    }

    async function stakeTokens() {
      if (!vault || !wmon || !userAddress) {
        alert("Please connect your wallet first!");
        return;
      }

      const amount = document.getElementById("stakeAmount").value;
      const durationDays = document.getElementById("lockDuration").value || 30;
      const referrer = document.getElementById("referrerAddress").value || ethers.ZeroAddress;

      if (!amount || Number(amount) <= 0) {
        alert("Enter a valid amount");
        return;
      }

      try {
        addActivityFeedItem("⏳", "Staking", "Processing...", "yellow");

        const decimals = await wmon.decimals();
        const amountWei = ethers.parseUnits(amount, decimals);
        const durationSec = Number(durationDays) * 24 * 60 * 60;

        const allowance = await wmon.allowance(userAddress, VAULT_V2_PROXY);
        if (allowance < amountWei) {
          const tx1 = await wmon.approve(VAULT_V2_PROXY, amountWei);
          await tx1.wait();
        }

        const tx2 = await vault.stake(WMON_ADDRESS, amountWei, durationSec, referrer);
        await tx2.wait();

        alert(`✅ Staked ${amount} WMON!`);
        document.getElementById("stakeAmount").value = "";
        
        await Promise.all([updateWalletBalance(), updateUserStakes(), fetchLiveDexData()]);
        addActivityFeedItem("🔒", "Staked", `${amount} WMON`, "green");
      } catch (err) {
        alert("Staking failed: " + (err.reason || err.message));
        addActivityFeedItem("❌", "Failed", err.message, "red");
      }
    }

    async function withdrawStake(stakeId) {
      if (!vault) return;
      
      try {
        const tx = await vault.withdraw(stakeId);
        await tx.wait();
        alert(`✅ Withdrew stake #${stakeId}!`);
        await Promise.all([updateWalletBalance(), updateUserStakes(), fetchLiveDexData()]);
        addActivityFeedItem("💰", "Withdrawn", `Stake #${stakeId}`, "green");
      } catch (err) {
        alert("Withdrawal failed: " + (err.reason || err.message));
      }
    }

    async function updateWalletBalance() {
      if (!wmon || !userAddress) return;
      
      try {
        const balance = await wmon.balanceOf(userAddress);
        const decimals = await wmon.decimals();
        const formatted = parseFloat(ethers.formatUnits(balance, decimals)).toFixed(2);
        document.getElementById("walletBalance").textContent = formatted + " WMON";
      } catch (err) {
        console.error("Balance error:", err);
      }
    }

    async function updateUserStakes() {
      if (!vault || !userAddress) return;

      try {
        const stakeIds = await vault.getUserStakes(userAddress);
        const stakes = [];

        for (let id of stakeIds) {
          try {
            const info = await vault.getStakeInfo(userAddress, id);
            stakes.push({
              id: id.toString(),
              amount: parseFloat(ethers.formatUnits(info[1], 18)).toFixed(4),
              unlockTime: new Date(Number(info[3]) * 1000).toLocaleDateString(),
              locked: Math.floor(Date.now() / 1000) < Number(info[3])
            });
          } catch (e) {}
        }

        renderStakes(stakes);
      } catch (err) {
        console.error("Stakes error:", err);
      }
    }

    function renderStakes(stakes) {
      const grid = document.getElementById("stakesGrid");
      if (!grid) return;

      if (stakes.length === 0) {
        grid.innerHTML = '<p style="text-align:center; padding:2rem;">No stakes found</p>';
        return;
      }

      grid.innerHTML = stakes.map(s => `
        <div class="glass-card">
          <p style="font-size:1.5rem; font-weight:bold;">${s.amount} WMON</p>
          <p style="color:#9ca3af; margin:0.5rem 0;">Stake #${s.id}</p>
          <p>Unlock: ${s.unlockTime}</p>
          <button 
            class="btn-primary" 
            style="margin-top:1rem; width:100%;"
            ${s.locked ? 'disabled' : ''}
            onclick="withdrawStake('${s.id}')">
            ${s.locked ? '🔒 LOCKED' : '💰 WITHDRAW'}
          </button>
        </div>
      `).join('');
    }

    async function fetchLiveDexData() {
      try {
        const vaultProvider = new ethers.JsonRpcProvider(RPC_URL);
        const vaultContract = new ethers.Contract(VAULT_V2_PROXY, VAULT_ABI, vaultProvider);

        const totalStaked = await vaultContract.totalStaked(WMON_ADDRESS);
        const formatted = parseFloat(ethers.formatUnits(totalStaked, 18)).toFixed(2);

        document.getElementById("totalStaked").textContent = formatted + " WMON";

        try {
          const users = await vaultContract.totalUsers();
          document.getElementById("totalUsers").textContent = users.toString();
        } catch (e) {
          document.getElementById("totalUsers").textContent = "N/A";
        }

        const dex = document.getElementById("dexData");
        if (dex) {
          dex.innerHTML = `
            <div class="glass-card">
              <h3>Total Value Locked</h3>
              <p style="font-size:2rem; font-weight:bold;">${formatted} WMON</p>
            </div>
          `;
        }

        addActivityFeedItem("✅", "Updated", "Live data refreshed", "green");
      } catch (err) {
        console.error("DEX data error:", err);
      }
    }

    function addActivityFeedItem(icon, title, desc, color) {
      const feed = document.getElementById("activityFeed");
      if (!feed) return;

      const colorMap = { green: "#10b981", red: "#ef4444", yellow: "#f59e0b", blue: "#3b82f6" };
      
      const item = document.createElement("div");
      item.style.padding = "1rem";
      item.style.borderBottom = "1px solid #44475A";
      item.innerHTML = `
        <span style="font-size:1.5rem;">${icon}</span>
        <strong style="color:${colorMap[color] || '#9ca3af'};">${title}</strong>
        <span style="color:#9ca3af; font-size:0.9rem;"> ${desc}</span>
      `;

      feed.insertBefore(item, feed.firstChild);
      while (feed.children.length > 5) feed.removeChild(feed.lastChild);
    }

    document.addEventListener("DOMContentLoaded", async function () {
      console.log("⚡ Initializing dashboard...");

      const connectBtn = document.getElementById("connectWallet");
      const stakeBtn = document.getElementById("stakeBtn");

      connectBtn.disabled = true;
      updateStatus("Initializing Web3Auth...", "yellow");

      try {
        await initWeb3Auth();
        
        connectBtn.textContent = "Connect Wallet";
        connectBtn.disabled = false;
        connectBtn.addEventListener("click", connectWallet);
        updateStatus("Ready to connect", "green");
      } catch (err) {
        connectBtn.textContent = "❌ Init Failed";
        updateStatus("Error: " + err.message, "red");
        console.error("Init failed:", err);
      }

      if (stakeBtn) stakeBtn.addEventListener("click", stakeTokens);

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll(".tab-section").forEach(sec => sec.style.display = "none");
          document.getElementById(tab).style.display = "block";
          
          if (tab === "live-dex") fetchLiveDexData();
          if (tab === "overview" && userAddress) {
            updateWalletBalance();
            updateUserStakes();
          }
        });
      });

      fetchLiveDexData();

      setInterval(() => {
        if (userAddress) {
          fetchLiveDexData();
          updateWalletBalance();
        }
      }, 15000);

      console.log("✅ Dashboard loaded");
    });
  </script>
</body>
</html>
