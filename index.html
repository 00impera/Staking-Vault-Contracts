<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Life DEX - Premium Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    :root {
      --background-base: #0A0F1C;
      --primary-accent: #00FFB3;
      --secondary-accent: #B300FF;
      --highlight-accent: #FFD700;
      --carbon-overlay: #1C1F26;
      --glyph-ring: #44475A;
      --qr-hash: #2E8B57;
      --shard-glow: #00FFFF;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--background-base);
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-image: repeating-linear-gradient(135deg, var(--carbon-overlay) 0 2px, transparent 2px 20px);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(0, 255, 179, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(179, 0, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      animation: gradientShift 15s ease infinite;
      z-index: 0;
    }
    @keyframes gradientShift { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
    .header-bar {
      background: var(--carbon-overlay);
      border-bottom: 2px solid var(--primary-accent);
      box-shadow: 0 2px 12px var(--primary-accent);
      padding: 1.5rem 2rem;
      text-shadow: 0 0 8px var(--primary-accent);
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-bar h1 {
      font-size: 2rem; font-weight: bold; letter-spacing: 2px; color: var(--primary-accent);
    }
    .sidebar-nav {
      position: fixed; top: 85px; left: 0; width: 220px; height: calc(100% - 85px);
      background: rgba(28, 31, 38, 0.95);
      border-right: 2px solid var(--glyph-ring);
      box-shadow: 2px 0 16px rgba(179, 0, 255, 0.3);
      display: flex; flex-direction: column; align-items: center; z-index: 50;
      padding: 2rem 1rem; backdrop-filter: blur(12px);
    }
    .sidebar-nav ul { list-style: none; width: 100%; margin-bottom: auto; }
    .sidebar-nav li { margin-bottom: 1rem; }
    .nav-btn {
      width: 100%; padding: 0.75rem 1rem;
      background: var(--carbon-overlay);
      border: 2px solid var(--primary-accent);
      color: var(--primary-accent);
      font-weight: bold; border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(0, 255, 179, 0.3);
      cursor: pointer; font-size: 0.9rem;
    }
    .nav-btn.active, .nav-btn:hover {
      border-color: var(--secondary-accent);
      color: var(--highlight-accent);
      box-shadow: 0 0 16px rgba(179, 0, 255, 0.6);
      transform: translateX(5px);
    }
    .glyph-ring {
      width: 80px; height: 80px; border: 4px solid var(--glyph-ring);
      border-radius: 50%; box-shadow: 0 0 24px var(--shard-glow);
      animation: rotate 6s linear infinite; position: relative; margin-top: 2rem;
    }
    .glyph-ring::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 40px; height: 40px;
      background: radial-gradient(circle, var(--shard-glow) 0%, transparent 70%);
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
    .main-panel {
      margin-left: 240px; margin-top: 105px; padding: 2rem;
      min-height: calc(100vh - 105px); position: relative; z-index: 1;
    }
    .glass-card {
      background: rgba(28, 31, 38, 0.9); backdrop-filter: blur(16px);
      border-radius: 16px; box-shadow: 0 0 24px rgba(0, 255, 255, 0.2);
      margin-bottom: 2rem; padding: 2rem; border: 1px solid var(--glyph-ring);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(28, 31, 38, 0.95);
      border-color: var(--primary-accent);
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(0, 255, 255, 0.3);
    }
    .gradient-border {
      position: relative; background: rgba(28, 31, 38, 0.9);
      backdrop-filter: blur(16px); border-radius: 16px; padding: 2rem; margin-bottom: 2rem;
    }
    .gradient-border::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent), var(--shard-glow));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0.6; transition: opacity 0.3s;
    }
    .gradient-border:hover::before { opacity: 1; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;
    }
    .stat-item {
      padding: 1rem; background: rgba(10, 15, 28, 0.6);
      border-radius: 8px; border: 1px solid var(--primary-accent);
      transition: all 0.3s ease;
    }
    .stat-item:hover {
      border-color: var(--secondary-accent);
      box-shadow: 0 0 16px rgba(179, 0, 255, 0.4);
    }
    .stat-label { color: var(--highlight-accent); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .stat-number {
      font-size: 1.5rem; font-weight: bold; font-variant-numeric: tabular-nums;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

    .live-pulse { animation: livePulse 2s ease-in-out infinite; }

      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .action-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-primary {
      padding: 0.75rem 2rem; border: none; border-radius: 8px; color: white;
      font-weight: bold; cursor: pointer;
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
      box-shadow: 0 4px 24px rgba(0, 255, 179, 0.3); transition: all 0.3s ease;
    }
    .btn-primary:hover {
      box-shadow: 0 8px 32px rgba(0, 255, 179, 0.5);
      transform: translateY(-2px);
    }
    .btn-secondary {
      padding: 0.75rem 2rem; border: 2px solid var(--primary-accent);
      border-radius: 8px; color: var(--primary-accent); font-weight: bold;
      cursor: pointer; background: rgba(71, 85, 105, 0.4); transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.6);
      border-color: var(--secondary-accent);
      color: var(--highlight-accent);
    }
    .activity-item {
      padding: 1rem; border-bottom: 1px solid var(--glyph-ring); transition: all 0.3s;
    }
    .activity-item:hover {
      background: rgba(30, 41, 59, 0.5);
      transform: translateX(4px);
    }
    .activity-item:last-child { border-bottom: none; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      background: rgba(10, 15, 28, 0.6);
      border: 1px solid var(--primary-accent);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--secondary-accent);
      box-shadow: 0 0 12px rgba(179, 0, 255, 0.4);
    }
  </style>

// ========== WEB3AUTH INITIALIZATION ==========
async function initWeb3Auth() {
  try {
    // Chain configuration for Monad Mainnet
    const chainConfig = {
      chainNamespace: "eip155",
      chainId: MONAD_CHAIN_ID_HEX,
      rpcTarget: RPC_URL,
      displayName: "Monad Mainnet",
      blockExplorerUrl: "https://explorer.monad.xyz",
      ticker: "MON",
      tickerName: "Monad",
    };

    // Initialize Web3Auth Modal with correct API
    web3auth = new window.Modal.Web3Auth({
      clientId: WEB3AUTH_CLIENT_ID,
      web3AuthNetwork: WEB3AUTH_NETWORK,
      chainConfig: chainConfig,
      uiConfig: {
        appName: "Digital Life DEX",
        mode: "dark",
        loginMethodsOrder: ["google", "facebook", "twitter", "discord", "email_passwordless"],
        defaultLanguage: "en",
        theme: {
          primary: "#00FFB3",
        },
      },
    });

    // IMPORTANT: Use initModal() instead of init()
    await web3auth.initModal();
    
    console.log("✅ Web3Auth initialized successfully");

    // Check if already connected from previous session
    if (web3auth.connected) {
      console.log("🔄 Restoring previous session...");
      await connectWallet();
    }
    
  } catch (error) {
    console.error("❌ Web3Auth init error:", error);
    throw error;
  }
}

// ========== INITIALIZATION ==========
document.addEventListener("DOMContentLoaded", async function () {
  console.log("⚡ STAKING VAULT DASHBOARD INITIALIZING ⚡");

  // Initialize Web3Auth FIRST
  try {
    await initWeb3Auth();
    console.log("✅ Web3Auth initialized");
  } catch (err) {
    console.error("❌ Web3Auth initialization error:", err);
    showAlert("Failed to initialize Web3Auth. Please refresh the page.");
  }

  // ========== EVENT LISTENERS ==========
  const connectBtn = document.getElementById("connectWallet");
  if (connectBtn) {
    connectBtn.addEventListener("click", connectWallet);
  } else {
    console.warn("⚠️ connectWallet button not found");
  }

  const stakeBtn = document.getElementById("stakeBtn");
  if (stakeBtn) {
    stakeBtn.addEventListener("click", stakeTokens);
  } else {
    console.warn("⚠️ stakeBtn button not found");
  }

  // ========== TAB SWITCHING ==========
  document.querySelectorAll(".nav-btn, .tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      if (!tab) {
        console.warn("⚠️ Tab button missing data-tab attribute");
        return;
      }

      // Remove active class from all nav buttons
      document
        .querySelectorAll(".nav-btn, .tab-btn")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      // Hide all tab sections
      document
        .querySelectorAll(".tab-section, .tab-content")
        .forEach((content) => (content.style.display = "none"));

      // Show selected tab
      const tabSection = document.getElementById(tab);
      if (tabSection) {
        tabSection.style.display = "block";
      } else {
        console.warn(`⚠️ Tab section with id="${tab}" not found`);
      }

      // Refresh data for specific tabs
      if (tab === "live-dex" || tab === "dex") {
        fetchLiveDexData();
      }
      if (tab === "overview" && userAddress) {
        updateWalletBalance();
        updateUserStakes();
      }
    });
  });

  // ========== INITIAL DATA FETCH ==========
  fetchLiveDexData();

  // ========== AUTO-REFRESH ==========
  setInterval(() => {
    if (userAddress) {
      fetchLiveDexData();
      updateWalletBalance();

// ========== WALLET CONNECTION ==========
async function connectWallet() {
  if (!web3auth) {
    showAlert("Web3Auth not initialized. Please refresh the page.");
    return;
  }

  try {
    addActivityFeedItem(
      "🔄",
      "Connecting Wallet",
      "Please select your login method...",
      "yellow"
    );

    // Connect with Web3Auth - opens login modal
    web3authProvider = await web3auth.connect();
    
    if (!web3authProvider) {
      throw new Error("Failed to connect with Web3Auth");
    }

    // Create ethers provider from Web3Auth provider
    provider = new ethers.BrowserProvider(web3authProvider);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    console.log("✅ Connected address:", userAddress);

    // Verify we're on correct network
    const network = await provider.getNetwork();
    console.log("📡 Connected to chain:", network.chainId.toString());

    // Initialize contract instances
    vault = new ethers.Contract(VAULT_V2_PROXY, VAULT_V2_IMPL_ABI, signer);
    wmon = new ethers.Contract(WMON_ADDRESS, WMON_ABI, signer);

    // Update connect button UI
    const connectBtn = document.getElementById("connectWallet");
    if (connectBtn) {
      connectBtn.textContent = "✅ " + shortAddr(userAddress);
      connectBtn.classList.add("connected");
      
      // Add disconnect on click when connected
      connectBtn.onclick = disconnectWallet;
    }

    // Fetch and update all user data
    await Promise.all([
      updateWalletBalance(),
      updateUserStakes(),
      fetchLiveDexData(),
    ]);

    addActivityFeedItem(
      "🔌",
      "Wallet Connected",
      shortAddr(userAddress),
      "green"
    );
    console.log("✅ Wallet fully connected and data loaded");

  } catch (err) {
    console.error("❌ Connection error:", err);
    
    // Handle user cancellation
    if (err.message && err.message.includes("User closed modal")) {
      addActivityFeedItem(
        "ℹ️",
        "Connection Cancelled",
        "You closed the login modal",
        "yellow"
      );
      return;
    }
    
    showAlert("Connection failed: " + (err.message || err));
    addActivityFeedItem(
      "❌",
      "Connection Failed",
      err.message || "Unknown error",
      "red"
    );
  }
}

// ========== DISCONNECT WALLET ==========
async function disconnectWallet() {
  try {
    addActivityFeedItem(
      "🔄",
      "Disconnecting Wallet",
      "Logging out...",
      "yellow"
    );

    // Logout from Web3Auth
    if (web3auth && web3auth.connected) {
      await web3auth.logout();
    }
    
    // Clear all state
    userAddress = null;
    provider = null;
    signer = null;
    vault = null;
    wmon = null;
    web3authProvider = null;
    
    // Reset connect button
    const connectBtn = document.getElementById("connectWallet");
    if (connectBtn) {
      connectBtn.textContent = "🔌 Connect Wallet";
      connectBtn.classList.remove("connected");
      connectBtn.onclick = connectWallet;

    const walletBalance = document.getElementById("walletBalance");
    if (walletBalance) walletBalance.textContent = "0.00 WMON";

      "🔌",
      "Wallet Disconnected",

    );

// ========== STAKE FUNCTION ==========
async function stakeTokens() {
  if (!vault || !wmon || !userAddress) {
    showAlert("Please connect your wallet first!");
    addActivityFeedItem(
      "⚠️",
      "Wallet Not Connected",
      "Connect wallet to stake",
      "red"
    );
    return;
  }

  const amountInput = document.getElementById("stakeAmount");
  const durationInput = document.getElementById("lockDuration");
  const referrerInput = document.getElementById("referrerAddress");

  const amount = amountInput?.value;
  const durationDays = durationInput?.value || 30;
  const referrer = referrerInput?.value || ethers.ZeroAddress;

  // Validation
  if (!amount || isNaN(amount) || Number(amount) <= 0) {
    showAlert("Please enter a valid amount to stake.");
    addActivityFeedItem(
      "⚠️",
      "Invalid Amount",
      "Enter a positive number",
      "red"
    );
    return;
  }

  try {
    addActivityFeedItem(
      "⏳",
      "Starting Transaction",
      "Preparing to stake tokens...",
      "yellow"
    );

    const decimals = await wmon.decimals();
    const amountWei = ethers.parseUnits(amount, decimals);
    const durationSec = Number(durationDays) * 24 * 60 * 60;

    // Check and approve if needed
    const allowance = await wmon.allowance(userAddress, VAULT_V2_PROXY);
    if (allowance < amountWei) {
      addActivityFeedItem(
        "🔄",
        "Approval Required",
        "Approving WMON tokens...",
        "yellow"
      );

      const approveTx = await wmon.approve(VAULT_V2_PROXY, amountWei);
      await approveTx.wait();

      addActivityFeedItem(
        "✅",
        "WMON Approved",
        "Tokens approved successfully",
        "green"
      );
    }

    // Stake tokens
    addActivityFeedItem(
      "🔄",
      "Staking Tokens",
      "Confirm transaction in wallet...",
      "yellow"
    );

    const stakeTx = await vault.stake(
      WMON_ADDRESS,
      amountWei,
      durationSec,
      referrer
    );
    await stakeTx.wait();

    showAlert(`✅ Successfully staked ${amount} WMON for ${durationDays} days!`);
    addActivityFeedItem(
      "🔒",
      "Tokens Staked",
      `${amount} WMON locked for ${durationDays} days`,
      "green"
    );

    // Clear form
    if (amountInput) amountInput.value = "";
    if (referrerInput) referrerInput.value = "";

    // Refresh data
    await Promise.all([
      updateWalletBalance(),
      updateUserStakes(),
      fetchLiveDexData(),
    ]);
  } catch (err) {
    console.error("❌ Stake error:", err);
    const errorMsg = err.reason || err.message || "Transaction failed";
    showAlert("Staking failed: " + errorMsg);
    addActivityFeedItem("❌", "Stake Failed", errorMsg, "red");
  }
}

// ========== WITHDRAW FUNCTION ==========
async function withdrawStake(stakeId) {
  if (!vault || !userAddress) {

  try {

      `Processing stake #${stakeId}...`,

    );

    const withdrawTx = await vault.withdraw(stakeId);
    await withdrawTx.wait();

// ========== FETCH WALLET BALANCE ==========
async function updateWalletBalance() {
  if (!wmon || !userAddress) return;

  try {
    const balance = await wmon.balanceOf(userAddress);
    const decimals = await wmon.decimals();
    const formattedBalance = parseFloat(
      ethers.formatUnits(balance, decimals)
    ).toFixed(2);

    const balanceEl = document.getElementById("walletBalance");
    if (balanceEl) {
      balanceEl.textContent = formattedBalance;
    }

    console.log("✅ Wallet balance updated:", formattedBalance, "WMON");
  } catch (err) {
    console.error("⚠️ Balance fetch error:", err);
    const balanceEl = document.getElementById("walletBalance");
    if (balanceEl) balanceEl.textContent = "0.00";
  }
}

// ========== FETCH USER STAKES ==========
async function updateUserStakes() {
  if (!vault || !userAddress) return;

  try {
    const stakeIds = await vault.getUserStakes(userAddress);
    const stakes = [];

    for (let id of stakeIds) {
      try {
        const info = await vault.getStakeInfo(userAddress, id);
        stakes.push({
          id: id.toString(),
          amount: parseFloat(ethers.formatUnits(info[1], 18)).toFixed(4),
          stakedAt: new Date(Number(info[2]) * 1000).toLocaleDateString(),
          unlockTime: new Date(Number(info[3]) * 1000).toLocaleDateString(),
          reward: parseFloat(ethers.formatUnits(info[5], 18)).toFixed(4),
          locked: Math.floor(Date.now() / 1000) < Number(info[3]),
        });
      } catch (err) {
        console.warn(`⚠️ Failed to fetch stake #${id}:`, err.message);
      }
    }

    renderStakes(stakes);
    console.log(`✅ Loaded ${stakes.length} stake(s)`);
  } catch (err) {
    console.error("⚠️ Stakes fetch error:", err);
    renderStakes([]);
  }
}

// ========== RENDER STAKES ==========
function renderStakes(stakes) {
  const grid = document.getElementById("stakesGrid");
  if (!grid) {
    console.warn("⚠️ stakesGrid element not found");
    return;
  }

  if (stakes.length === 0) {
    grid.innerHTML = `
      <div class="glass-card rounded-2xl p-8 text-center col-span-full">
        <div class="text-6xl mb-4">📭</div>
        <p class="text-gray-400 text-lg mb-2">No active stakes found</p>
        <p class="text-gray-500 text-sm">Start staking to earn rewards!</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = stakes
    .map(
      (s) => `
    <div class="glass-card rounded-xl p-6 border-2 ${
      s.locked
        ? "border-yellow-500 border-opacity-20"
        : "border-green-500 border-opacity-20"
    } hover:border-opacity-40 transition-all">
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-white text-2xl font-bold">${s.amount} WMON</p>
          <p class="text-gray-400 text-sm">Stake ID: #${s.id}</p>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-bold ${
          s.locked
            ? "bg-yellow-500 bg-opacity-20 text-yellow-400"
            : "bg-green-500 bg-opacity-20 text-green-400"
        }">
          ${s.locked ? "🔒 LOCKED" : "💰 UNLOCKED"}
        </span>
      </div>
      
      <div class="space-y-3 mb-4">
        <div class="flex justify-between">
          <span class="text-gray-400">Staked On</span>
          <span class="text-white font-medium">${s.stakedAt}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">Unlock Date</span>
          <span class="text-white font-bold">${s.unlockTime}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">Rewards Earned</span>
          <span class="text-green-400 font-bold">+${s.reward} WMON</span>
        </div>
      </div>
      
      <button
        class="${
          s.locked
            ? "bg-gray-700 cursor-not-allowed"
            : "btn-primary hover:scale-105"
        } w-full py-3 text-white font-bold rounded-lg transition-all"
        ${s.locked ? "disabled" : ""}
        onclick="withdrawStake('${s.id}')">
        ${s.locked ? "🔒 LOCKED" : "💰 WITHDRAW NOW"}
      </button>
    </div>
  `
    )
    .join("");
}

// ========== FETCH CRYPTO PRICES ==========
async function fetchCryptoPrices() {
  try {
    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=ethereum,bitcoin&vs_currencies=usd&include_24hr_change=true"
    );

    if (!response.ok) {
      throw new Error("Failed to fetch prices");
    }

    const data = await response.json();

    return {
      monad: 1.24,
      monadChange: 2.5,
      wmon: 1.24,
      wmonChange: 2.5,
      eth: data.ethereum?.usd || 3500,
      ethChange: parseFloat(data.ethereum?.usd_24h_change || 0).toFixed(2),
      btc: data.bitcoin?.usd || 95000,
      btcChange: parseFloat(data.bitcoin?.usd_24h_change || 0).toFixed(2),
    };
  } catch (error) {
    console.error("⚠️ Price fetch error:", error);
    return {
      monad: 1.24,
      monadChange: 0,
      wmon: 1.24,
      wmonChange: 0,
      eth: 3500,
      ethChange: 0,
      btc: 95000,
      btcChange: 0,
    };
  }
}

// ========== ACTIVITY FEED ==========
function addActivityFeedItem(icon, title, description, color = "yellow") {
  const feed = document.getElementById("activityFeed");
  if (!feed) return;

  const colorClasses = {
    green: "text-green-400",
    red: "text-red-400",
    yellow: "text-yellow-400",
    blue: "text-blue-400",
  };

  const item = document.createElement("div");
  item.className =
    "activity-item flex items-center justify-between p-4 rounded-lg bg-gray-800 bg-opacity-30 hover:bg-opacity-50 transition-all animate-fadeIn";
  item.innerHTML = `
    <div class="flex items-center gap-3">
      <span class="text-2xl">${icon}</span>
      <div>
        <p class="font-semibold ${colorClasses[color] || "text-gray-400"}">${title}</p>
        <p class="text-xs text-gray-500">${description}</p>
      </div>
    </div>
    <span class="text-xs text-gray-500">${new Date().toLocaleTimeString()}</span>
  `;

  feed.insertBefore(item, feed.firstChild);

  while (feed.children.length > 5) {
    feed.removeChild(feed.lastChild);
  }
}
