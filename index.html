<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RPG MONAD MINET — Staking Vault</title>
  <meta name="description" content="Stake WMON, earn rewards, and refer others. Cosmic glass UI." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* (UI styles unchanged from your template) */
    :root { --bg:#0a0c1a; --card:rgba(30,34,54,0.82); --muted:#b0b8d0; --text:#f8faff; --cosmic-blue:linear-gradient(120deg,#4fd4ff 0%,#8a2cff 100%); --cosmic-glow:0 0 32px 0 #4fd4ff,0 2px 8px 0 #8a2cff44; }
    html,body{margin:0;background:linear-gradient(180deg,#0a0c1a 0%,#1a1c2a 100%);color:var(--text);font-family:'Inter',system-ui,Segoe UI,Roboto,Arial}
    .container{max-width:1200px;margin:40px auto;padding:28px}
    header{display:flex;align-items:center;justify-content:space-between}
    .logo{width:56px;height:56px;border-radius:12px;background:var(--cosmic-blue);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a0c1a}
    .card,.glass-card{background:var(--card);border-radius:18px;padding:22px;margin-top:20px}
    .muted{color:var(--muted)}
    .btn{background:var(--cosmic-blue);color:#fff;padding:10px 18px;border-radius:12px;border:0;cursor:pointer}
    .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .small{font-size:0.9rem;color:var(--muted)}
    select,input {padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:#0d1117;color:var(--text)}
    .muted-small{color:var(--muted);font-size:0.9rem}
    pre.debug { background:#081018;color:#bfefff;padding:10px;border-radius:8px;overflow:auto;max-height:200px;margin-top:12px }
  </style>

  <!-- Ethers v5 and Web3Auth modal UMD (kept as you used) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.1/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@7.2.0/dist/modal.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div style="display:flex;gap:14px;align-items:center">
        <div class="logo">RM</div>
        <div>
          <h1 style="margin:0">RPG MONAD MINET — Staking Vault</h1>
          <div class="small muted">Stake WMON, lock for rewards, invite friends.</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="small muted" id="network-indicator">Network: Sapphire Mainnet (default)</div>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="w3a-address" class="small muted" style="min-width:170px">Not connected</div>
          <button id="w3a-connect" class="btn" disabled>Initializing...</button>
        </div>
      </div>
    </header>

    <!-- Main UI (trimmed for clarity) -->
    <div class="card">
      <h3 style="margin:0 0 8px 0">Quick Stake</h3>
      <div class="muted-small">Token <select id="stakeToken"></select></div>
      <div style="display:flex;gap:12px;margin-top:12px;align-items:center">
        <div>Balance: <strong id="selectedTokenBalance">0.0000</strong></div>
        <div>Price: <strong id="selectedTokenPrice">N/A</strong></div>
        <div>USD: <strong id="selectedTokenUsd">N/A</strong></div>
      </div>

      <div style="margin-top:12px;display:flex;gap:12px;align-items:center">
        <input id="stakeAmount" placeholder="Amount" style="width:160px">
        <select id="lockDuration"><option value="30">30d</option><option value="60">60d</option><option value="90">90d</option></select>
        <input id="referrerAddress" placeholder="Referrer (optional)" style="width:260px">
        <button id="stakeBtn" class="btn">Stake</button>
        <button id="revokeBtn" class="btn secondary">Revoke</button>
      </div>

      <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap">
        <div class="muted-small">Allowance: <strong id="allowanceValue">—</strong></div>
        <div class="muted-small">Pending rewards: <strong id="pendingRewards">—</strong></div>
        <div class="muted-small">APY: <strong id="apyDisplay">—</strong></div>
      </div>
    </div>

    <div class="glass-card" id="debugPanel" style="display:none">
      <h4 style="margin:0 0 8px 0">Debug / Console (visible on init failure)</h4>
      <pre id="debugLog" class="debug"></pre>
    </div>

  </div>

  <script>
  // ============================
  // Configuration / constants
  // ============================
  // Your Web3Auth client ID (no secret here)
  const WEB3AUTH_CLIENT_ID = "BM_xtlDAKQnuJR2-_N6dQuVvkSP7TTIglL1ho47LG7DP_ZbJT1HftQJ7F0RCoA0HvZKRfMeyRfwgJmZYgM-ZVSs";

  // Detect network from URL query: ?network=monad or ?network=sapphire
  const urlParams = new URLSearchParams(window.location.search);
  const SELECTED_NETWORK = (urlParams.get('network') || 'sapphire').toLowerCase();

  // Chain configs for Web3Auth (choose the proper RPC endpoints you control)
  const CHAIN_CONFIGS = {
    sapphire: {
      chainNamespace: "eip155",
      chainIdHex: "0x5afe", // 23294
      rpcTarget: "https://rpc.oasys.sapphire-mainnet.oasys.games",
      displayName: "Sapphire Mainnet",
      blockExplorer: "https://explorer.oasys.games",
      ticker: "ETH", tickerName: "Ethereum"
    },
    monad: {
      chainNamespace: "eip155",
      chainIdHex: "0x8e3", // 2275
      rpcTarget: "https://monad-mainnet.g.alchemy.com/v2/Uwb7T0DbXMQHjiJBNf9_b005qYjLmJqk", // fallback Alchemy - replace with your own if needed
      displayName: "Monad Mainnet",
      blockExplorer: "https://monadscan.io",
      ticker: "MON", tickerName: "Monad"
    }
  };

  const CHAIN = CHAIN_CONFIGS[SELECTED_NETWORK] || CHAIN_CONFIGS.sapphire;
  document.getElementById('network-indicator').textContent = `Network: ${CHAIN.displayName} (chainId ${parseInt(CHAIN.chainIdHex,16)})`;

  // RPC fallback for read-only calls (use a reliable RPC; don't put private keys here)
  const FALLBACK_JSONRPC = CHAIN.rpcTarget;

  // Contracts (use the addresses you posted)
  const VAULT_ADDRESS = "0x2C18eb6708cb7c03C19c7C793345bd22E9d261b8";
  const WMON_ADDRESS  = "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A";
  const USDC_ADDRESS  = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603";
  const BITCOINFLASH_ADDRESS = "0x7d7E0112d2763c98238aF7cebEAe33d53F3F76DD";

  // Minimal ABIs (trimmed to the functions/events used by the UI)
  const ERC20_FULL_ABI = [ /* name/symbol/decimals/balanceOf/allowance/approve/Transfer */ 
    {"constant":true,"inputs":[],"name":"name","outputs":[{"name":"","type":"string"}],"type":"function"},
    {"constant":true,"inputs":[],"name":"symbol","outputs":[{"name":"","type":"string"}],"type":"function"},
    {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"type":"function"},
    {"constant":true,"inputs":[{"name":"owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"type":"function"},
    {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"type":"function"},
    {"constant":false,"inputs":[{"name":"spender","type":"address"},{"name":"amount","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"},
    {"anonymous":false,"inputs":[{"indexed":true,"name":"from","type":"address"},{"indexed":true,"name":"to","type":"address"},{"indexed":false,"name":"value","type":"uint256"}],"name":"Transfer","type":"event"}
  ];

  const WMON_ABI = [ /* common WETH-like functions */ 
    {"constant":true,"inputs":[{"name":"","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"type":"function"},
    {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"type":"function"},
    {"constant":false,"inputs":[],"name":"deposit","outputs":[],"stateMutability":"payable","type":"function"},
    {"constant":false,"inputs":[{"name":"wad","type":"uint256"}],"name":"withdraw","outputs":[],"type":"function"},
    {"constant":false,"inputs":[{"name":"guy","type":"address"},{"name":"wad","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"},
    {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"type":"function"},
    {"anonymous":false,"inputs":[{"indexed":true,"name":"src","type":"address"},{"indexed":true,"name":"dst","type":"address"},{"indexed":false,"name":"wad","type":"uint256"}],"name":"Transfer","type":"event"}
  ];

  const VAULT_ABI = [
    {"inputs":[],"name":"getSupportedTokens","outputs":[{"type":"address[]","name":""}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"user","type":"address"}],"name":"getUserStakes","outputs":[{"type":"uint256[]","name":""}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"user","type":"address"},{"name":"stakeId","type":"uint256"}],"name":"getStakeInfo","outputs":[{"type":"address","name":"token"},{"type":"uint256","name":"amount"},{"type":"uint256","name":"stakedAt"},{"type":"uint256","name":"unlockTime"},{"type":"bool","name":"withdrawn"},{"type":"bool","name":"canWithdraw"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"token","type":"address"},{"name":"amount","type":"uint256"},{"name":"duration","type":"uint256"}],"name":"stake","outputs":[{"name":"stakeId","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"stakeId","type":"uint256"}],"name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"token","type":"address"}],"name":"totalStaked","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"anonymous":false,"inputs":[{"indexed":true,"name":"user","type":"address"},{"indexed":true,"name":"stakeId","type":"uint256"},{"indexed":true,"name":"token","type":"address"},{"indexed":false,"name":"amount","type":"uint256"},{"indexed":false,"name":"unlockTime","type":"uint256"}],"name":"TokenStaked","type":"event"},
    {"anonymous":false,"inputs":[{"indexed":true,"name":"user","type":"address"},{"indexed":true,"name":"stakeId","type":"uint256"},{"indexed":false,"name":"amount","type":"uint256"}],"name":"StakeWithdrawn","type":"event"}
  ];

  const TOKEN_ABIS = {
    [WMON_ADDRESS.toLowerCase()]: WMON_ABI,
    [USDC_ADDRESS.toLowerCase()]: ERC20_FULL_ABI,
    [BITCOINFLASH_ADDRESS.toLowerCase()]: ERC20_FULL_ABI
  };

  function createTokenContract(address, providerOrSigner) {
    const a = address.toLowerCase();
    const abi = TOKEN_ABIS[a] || ERC20_FULL_ABI;
    return new ethers.Contract(address, abi, providerOrSigner);
  }

  // ============================
  // Runtime state
  // ============================
  let web3auth = null;
  let walletProvider = null;
  let ethersProvider = null;
  let signer = null;
  let currentAddress = null;
  let vaultContract = null;
  const rpcFallbackProvider = new ethers.providers.JsonRpcProvider(FALLBACK_JSONRPC);

  // UI references
  const ui = {
    connectBtn: document.getElementById('w3a-connect'),
    address: document.getElementById('w3a-address'),
    stakeToken: document.getElementById('stakeToken'),
    selectedTokenBalance: document.getElementById('selectedTokenBalance'),
    selectedTokenPrice: document.getElementById('selectedTokenPrice'),
    selectedTokenUsd: document.getElementById('selectedTokenUsd'),
    allowanceValue: document.getElementById('allowanceValue'),
    revokeBtn: document.getElementById('revokeBtn'),
    pendingRewards: document.getElementById('pendingRewards'),
    apyDisplay: document.getElementById('apyDisplay'),
    stakeBtn: document.getElementById('stakeBtn'),
    stakeAmount: document.getElementById('stakeAmount'),
    lockDuration: document.getElementById('lockDuration'),
    referrerAddress: document.getElementById('referrerAddress'),
    stakesGrid: document.getElementById('stakesGrid'),
    txList: document.getElementById('txList'),
    tokensList: document.getElementById('tokensList'),
    refRewards: document.getElementById('refRewards'),
    debugPanel: document.getElementById('debugPanel'),
    debugLog: document.getElementById('debugLog')
  };

  // Small debug logger (also shows UI debug panel when needed)
  function log(...args) {
    console.log(...args);
    ui.debugLog.textContent += args.map(a => (typeof a === 'string' ? a : (a && a.stack) ? a.stack : JSON.stringify(a,null,2))).join(' ') + '\n';
  }
  function showDebugPanel() { ui.debugPanel.style.display = 'block'; }

  // Attach global unhandled rejection handler to capture errors
  window.addEventListener('unhandledrejection', (ev) => {
    log('UnhandledRejection:', ev.reason);
    showDebugPanel();
  });

  // ============================
  // Web3Auth init + robust detection
  // ============================
  async function initWeb3Auth() {
    ui.connectBtn.disabled = true;
    ui.connectBtn.textContent = 'Initializing...';
    try {
      // detect Web3Auth constructor exported by modal UMD
      const Web3AuthConstructor = (window.Web3AuthModal && window.Web3AuthModal.Web3Auth) || window.Web3Auth || (window.Web3AuthModal && window.Web3AuthModal.default && window.Web3AuthModal.default.Web3Auth);
      if (!Web3AuthConstructor) {
        throw new Error('Web3Auth modal library not found. Confirm the CDN script loaded correctly.');
      }

      web3auth = new Web3AuthConstructor({
        clientId: WEB3AUTH_CLIENT_ID,
        chainConfig: {
          chainNamespace: CHAIN.chainNamespace,
          chainId: CHAIN.chainIdHex,
          rpcTarget: CHAIN.rpcTarget,
          displayName: CHAIN.displayName,
          blockExplorer: CHAIN.blockExplorer,
          ticker: CHAIN.ticker,
          tickerName: CHAIN.tickerName
        },
        web3AuthNetwork: "mainnet"
      });

      // initModal may throw if not served over https/local or clientId invalid
      await web3auth.initModal();
      log('Web3Auth initModal finished');
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connect Wallet';
      ui.connectBtn.title = 'Click to open Web3Auth modal';

      // If a session already exists, we can auto-connect: optional
      if (web3auth.provider) {
        log('Auto-connecting using existing provider session');
        await connectWeb3Auth(true);
      }
    } catch (err) {
      console.error('initWeb3Auth error', err);
      log('initWeb3Auth error: ' + (err.message || err));
      showDebugPanel();
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connect Wallet';
      ui.connectBtn.title = 'Init failed: see debug console';
    }
  }

  // Connect handler with extra logging and checks
  async function connectWeb3Auth(isAuto = false) {
    try {
      if (!web3auth) {
        throw new Error('Web3Auth not initialized');
      }

      // basic host/https check
      const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!isSecure && !isAuto) {
        const warning = 'Web3Auth requires HTTPS or localhost. Serve the file over http://localhost or use a secure host.';
        log(warning);
        alert(warning);
        showDebugPanel();
        return;
      }

      ui.connectBtn.disabled = true;
      ui.connectBtn.textContent = 'Connecting...';
      log('Calling web3auth.connect() ...');

      walletProvider = await web3auth.connect();
      if (!walletProvider) {
        throw new Error('No provider returned from web3auth.connect()');
      }

      // create ethers provider + signer (Ethers v5 usage)
      ethersProvider = new ethers.providers.Web3Provider(walletProvider);
      signer = ethersProvider.getSigner();
      currentAddress = (await signer.getAddress()).toLowerCase();
      ui.address.textContent = 'Connected: ' + currentAddress;
      log('Connected address:', currentAddress);

      // create vault contract with signer for write operations
      vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, signer);

      // call post-connect actions
      await afterWalletConnected();
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connected';
    } catch (err) {
      console.error('connectWeb3Auth error', err);
      log('connectWeb3Auth error: ' + (err.message || err));
      showDebugPanel();
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connect Wallet';
      alert('Connect failed: ' + (err.message || err));
    }
  }

  // Bind connect button (ensures init called first)
  ui.connectBtn.addEventListener('click', async () => {
    try {
      if (!web3auth) await initWeb3Auth();
      await connectWeb3Auth();
    } catch (e) {
      console.error('Connect button handler error', e);
      log('Connect button handler error: ' + (e.message || e));
      showDebugPanel();
    }
  });

  // ============================
  // Post-connect UI / contract flows (same logic as before but with added logging)
  // ============================
  async function afterWalletConnected() {
    log('afterWalletConnected start');
    try {
      await loadSupportedTokens();
      await loadUserBalance();
      await loadAllowance();
      await loadPendingRewards();
      await loadAPY();
      await loadUserStakes();
      await loadRecentActivity();
      await loadReferrerRewards();
      log('afterWalletConnected completed');
    } catch (e) {
      console.warn('afterWalletConnected failed', e);
      log('afterWalletConnected failed: ' + (e.message || e));
      showDebugPanel();
    }
  }

  async function loadSupportedTokens() {
    log('loadSupportedTokens');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const tokens = await vaultRead.getSupportedTokens().catch(()=>null);
      let list = [];
      if (tokens && tokens.length) list = tokens.map(t => t.toLowerCase());
      else list = [WMON_ADDRESS.toLowerCase(), USDC_ADDRESS.toLowerCase(), BITCOINFLASH_ADDRESS.toLowerCase()];

      ui.stakeToken.innerHTML = '';
      for (const t of list) {
        const token = createTokenContract(t, rpcFallbackProvider);
        let symbol = t.slice(0,6);
        try { symbol = await token.symbol(); } catch(e){ /* ignore */ }
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = symbol;
        ui.stakeToken.appendChild(opt);
      }
      // default WMON if present
      const w = WMON_ADDRESS.toLowerCase();
      if (Array.from(ui.stakeToken.options).some(o => o.value === w)) ui.stakeToken.value = w;
      ui.tokensList && (ui.tokensList.textContent = Array.from(ui.stakeToken.options).map(o=>o.textContent).join(', '));
      ui.stakeToken.dispatchEvent(new Event('change'));
      log('Supported tokens loaded:', list);
    } catch (e) {
      console.warn('loadSupportedTokens error', e);
      log('loadSupportedTokens error: ' + (e.message || e));
      showDebugPanel();
    }
  }

  async function loadUserBalance() {
    log('loadUserBalance');
    if (!signer || !currentAddress) return;
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const [bal, dec] = await Promise.all([ token.balanceOf(currentAddress), token.decimals().catch(()=>18) ]);
      ui.selectedTokenBalance.textContent = ethers.utils.formatUnits(bal, dec);
      await updateSelectedTokenPrice();
    } catch (e) {
      console.warn('loadUserBalance failed', e);
      log('loadUserBalance failed: ' + (e.message || e));
      ui.selectedTokenBalance.textContent = '0.0000';
    }
  }

  async function updateSelectedTokenPrice() {
    const addr = ui.stakeToken.value;
    const pEl = ui.selectedTokenPrice, vEl = ui.selectedTokenUsd;
    if (!addr) { pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
    pEl.textContent='Loading...'; vEl.textContent='Loading...';
    try {
      const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`).catch(()=>null);
      const json = res ? await res.json().catch(()=>null) : null;
      const price = json && json.pairs && json.pairs[0] ? Number(json.pairs[0].priceUsd) : null;
      if (!price){ pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
      pEl.textContent = `$${price.toFixed(6)}`;
      const bal = Number(ui.selectedTokenBalance.textContent) || 0;
      vEl.textContent = `$${(bal * price).toFixed(4)}`;
    } catch(e){
      console.warn('updateSelectedTokenPrice error', e);
      log('updateSelectedTokenPrice error: ' + (e.message || e));
      pEl.textContent='N/A'; vEl.textContent='N/A';
    }
  }

  async function loadAllowance() {
    log('loadAllowance');
    if (!signer || !currentAddress) { ui.allowanceValue.textContent = 'Connect wallet'; return; }
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const dec = await token.decimals().catch(()=>18);
      const allowance = await token.allowance(currentAddress, VAULT_ADDRESS);
      ui.allowanceValue.textContent = ethers.utils.formatUnits(allowance, dec);
      ui.revokeBtn.disabled = false;
    } catch (e) {
      console.warn('loadAllowance failed', e);
      log('loadAllowance failed: ' + (e.message || e));
      ui.allowanceValue.textContent = 'N/A';
      ui.revokeBtn.disabled = true;
      showDebugPanel();
    }
  }

  async function loadPendingRewards() {
    log('loadPendingRewards');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const pendingNames = ['calculateRewards','pendingRewards','pendingReward','earned','rewardsOf','pending'];
      let pending = null;
      for (const fn of pendingNames) {
        if (vaultRead[fn]) {
          try { pending = await vaultRead[fn](currentAddress); break; } catch(e){ /* ignore */ }
        }
      }
      ui.pendingRewards.textContent = pending ? ethers.utils.formatUnits(pending, 18) : 'N/A';
    } catch (e) {
      console.warn('loadPendingRewards failed', e);
      log('loadPendingRewards failed: ' + (e.message || e));
      ui.pendingRewards.textContent = 'N/A';
    }
  }

  async function loadAPY() {
    log('loadAPY');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const rateFns = ['rewardRate','rewardPerSecond','rewardsPerSecond','rewardRatePerSecond'];
      let rate = null;
      for (const fn of rateFns) {
        if (vaultRead[fn]) {
          try { rate = await vaultRead[fn](); break; } catch(e){}
        }
      }
      const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
      let totalStaked = null;
      try { totalStaked = await vaultRead.totalStaked(tokenAddr); } catch(e){}
      if (rate && totalStaked && totalStaked.gt(0)) {
        const SECONDS_PER_YEAR = 365 * 24 * 60 * 60;
        const rateNum = Number(rate.toString());
        const totalNum = Number(totalStaked.toString());
        const apy = (rateNum * SECONDS_PER_YEAR / totalNum) * 100;
        ui.apyDisplay.textContent = `${apy.toFixed(2)}% (est)`;
      } else {
        ui.apyDisplay.textContent = 'N/A';
      }
    } catch (e) {
      console.warn('loadAPY failed', e);
      log('loadAPY failed: ' + (e.message || e));
      ui.apyDisplay.textContent = 'N/A';
    }
  }

  async function loadUserStakes() {
    log('loadUserStakes');
    ui.stakesGrid && (ui.stakesGrid.textContent = 'Loading...');
    if (!currentAddress) { ui.stakesGrid && (ui.stakesGrid.textContent = 'Connect wallet to view stakes'); return; }
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const ids = await vaultRead.getUserStakes(currentAddress).catch(()=>[]);
      if (!ids || ids.length === 0) { ui.stakesGrid && (ui.stakesGrid.innerHTML = '<div class="muted">No stakes</div>'); return; }
      const rows = [];
      for (const id of ids) {
        try {
          const info = await vaultRead.getStakeInfo(currentAddress, id);
          const tokenAddr = (info.token || WMON_ADDRESS).toLowerCase();
          const token = createTokenContract(tokenAddr, rpcFallbackProvider);
          const dec = await token.decimals().catch(()=>18);
          const symbol = await token.symbol().catch(()=>tokenAddr.slice(0,6));
          const amount = parseFloat(ethers.utils.formatUnits(info.amount || ethers.constants.Zero, dec)).toFixed(4);
          const unlock = info.unlockTime ? new Date(Number(info.unlockTime.toString())*1000).toLocaleString() : 'N/A';
          const locked = info.canWithdraw === false;
          const idStr = id.toString();
          rows.push(`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.03)"><div style="width:36px;height:36px;border-radius:6px;background:#0003;display:flex;align-items:center;justify-content:center">${(symbol||'T')[0]}</div><div><div style="font-weight:700">${amount} ${symbol}</div><div class="muted-small">Stake #${idStr} • Unlock: ${unlock}</div></div><div style="margin-left:auto"><button ${locked ? 'disabled' : ''} onclick="window.withdrawStake && window.withdrawStake('${idStr}')">${locked ? '🔒 LOCKED' : 'Withdraw'}</button></div></div>`);
        } catch (e) {
          console.warn('getStakeInfo failed', e);
        }
      }
      ui.stakesGrid && (ui.stakesGrid.innerHTML = rows.join('') || '<div class="muted">No stakes</div>');
    } catch (e) {
      console.error('loadUserStakes failed', e);
      ui.stakesGrid && (ui.stakesGrid.textContent = 'Failed to load stakes');
      log('loadUserStakes failed: ' + (e.message || e));
    }
  }

  window.withdrawStake = async function(stakeIdStr) {
    if (!vaultContract || !signer) return alert('Connect wallet first');
    try {
      log('withdrawStake', stakeIdStr);
      const bn = ethers.BigNumber.from(stakeIdStr);
      const tx = await vaultContract.withdraw(bn);
      await tx.wait();
      alert('Withdrawn stake ' + stakeIdStr);
      await Promise.all([ loadUserStakes(), loadUserBalance(), loadPendingRewards(), loadAPY(), loadRecentActivity() ]);
    } catch (e) {
      console.error('withdrawStake failed', e);
      log('withdrawStake failed: ' + (e.message || e));
      alert('Withdraw failed: ' + (e.message || e));
      showDebugPanel();
    }
  };

  async function loadRecentActivity() {
    log('loadRecentActivity');
    try {
      const provider = rpcFallbackProvider;
      const blockNum = await provider.getBlockNumber();
      const fromBlock = Math.max(0, blockNum - 5000);
      const txs = [];

      // token transfers
      for (const addr of [WMON_ADDRESS, USDC_ADDRESS, BITCOINFLASH_ADDRESS]) {
        try {
          const token = createTokenContract(addr, provider);
          const filter = token.filters.Transfer();
          const evs = await token.queryFilter(filter, fromBlock, blockNum).catch(()=>[]);
          for (const ev of evs.slice(-6)) {
            const vals = ev.args || [];
            txs.push({title:`Transfer ${vals[2] ? vals[2].toString() : ''}`, desc:`${vals[0]||''} → ${vals[1]||''}`});
          }
        } catch(e){}
      }

      // vault events
      try {
        const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, provider);
        const ts = await vaultRead.queryFilter(vaultRead.filters.TokenStaked(), fromBlock, blockNum).catch(()=>[]);
        const sw = await vaultRead.queryFilter(vaultRead.filters.StakeWithdrawn(), fromBlock, blockNum).catch(()=>[]);
        for (const ev of ts.slice(-6)) {
          const a = ev.args || [];
          txs.push({title:`Staked ${a[3] ? a[3].toString() : ''}`, desc:`${a[0]||''} • stake #${a[1] ? a[1].toString() : ''}`});
        }
        for (const ev of sw.slice(-6)) {
          const a = ev.args || [];
          txs.push({title:`Withdrawn ${a[2] ? a[2].toString() : ''}`, desc:`${a[0]||''} • stake #${a[1] ? a[1].toString() : ''}`});
        }
      } catch(e){}

      ui.txList && (ui.txList.innerHTML = '');
      if (txs.length === 0) {
        ui.txList && (ui.txList.innerHTML = '<div class="muted">No recent transfers</div>');
      } else {
        txs.slice(-20).reverse().forEach(t => {
          const n = document.createElement('div');
          n.style.padding = '6px 0';
          n.innerHTML = `<div style="font-weight:600">${t.title}</div><div class="muted-small">${t.desc}</div>`;
          ui.txList && ui.txList.appendChild(n);
        });
      }
    } catch (e) {
      console.warn('loadRecentActivity failed', e);
      log('loadRecentActivity failed: ' + (e.message || e));
      ui.txList && (ui.txList.textContent = 'Transaction history unavailable');
    }
  }

  async function loadReferrerRewards() {
    log('loadReferrerRewards');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const names = ['referrerRewardsOf','referrerRewards','refRewards','referralRewards'];
      let val = null;
      for (const n of names) {
        if (vaultRead[n]) {
          try { val = await vaultRead[n](currentAddress); break; } catch(e){}
        }
      }
      ui.refRewards && (ui.refRewards.textContent = val ? ethers.utils.formatUnits(val,18) : '—');
    } catch (e) {
      console.warn('loadReferrerRewards failed', e);
      log('loadReferrerRewards failed: ' + (e.message || e));
      ui.refRewards && (ui.refRewards.textContent = '—');
    }
  }

  // Stake / approve / revoke wiring
  ui.stakeBtn.addEventListener('click', async () => {
    if (!signer || !vaultContract) return alert('Connect wallet first!');
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    const amountRaw = ui.stakeAmount.value;
    const durationDays = Number(ui.lockDuration.value || 30);
    if (!amountRaw || Number(amountRaw) <= 0) return alert('Enter valid amount');

    try {
      const token = createTokenContract(tokenAddr, signer);
      const dec = await token.decimals().catch(()=>18);
      const amountWei = ethers.utils.parseUnits(String(amountRaw), dec);
      const allowance = await token.allowance(currentAddress, VAULT_ADDRESS);
      if (allowance.lt(amountWei)) {
        log('Approving token for vault...');
        const txA = await token.approve(VAULT_ADDRESS, amountWei);
        await txA.wait();
        log('Approve confirmed');
      }
      const durationSec = durationDays * 24 * 60 * 60;
      const tx = await vaultContract.stake(tokenAddr, amountWei, durationSec);
      await tx.wait();
      alert('Stake confirmed');
      await Promise.all([ loadUserBalance(), loadUserStakes(), loadAllowance(), loadPendingRewards(), loadRecentActivity() ]);
    } catch (e) {
      console.error('stake failed', e);
      log('stake failed: ' + (e.message || e));
      showDebugPanel();
      alert('Stake failed: ' + (e.message || e));
    }
  });

  ui.revokeBtn.addEventListener('click', async () => {
    if (!signer) return alert('Connect wallet first!');
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const tx = await token.approve(VAULT_ADDRESS, 0);
      await tx.wait();
      alert('Allowance revoked');
      await loadAllowance();
    } catch (e) {
      console.error('revoke failed', e);
      log('revoke failed: ' + (e.message || e));
      showDebugPanel();
      alert('Revoke failed: ' + (e.message || e));
    }
  });

  // token change updates
  ui.stakeToken.addEventListener('change', async () => {
    await Promise.all([ loadUserBalance(), loadAllowance(), loadPendingRewards(), loadAPY() ]);
  });

  // Init on page load: ensure initWeb3Auth runs early
  (async function boot() {
    try {
      await initWeb3Auth();
      // initial token list populate (read-only)
      await loadSupportedTokens();
    } catch (e) {
      console.error('boot/init failed', e);
      log('boot init failed: ' + (e.message || e));
      showDebugPanel();
    }
  })();

  // Helpful message for developers / testers
  console.info('Page booted. If Web3Auth modal doesn\'t open: run on https:// or http://localhost, confirm client ID is registered for this domain, and check console for errors.');

  </script>
</body>
</html>
