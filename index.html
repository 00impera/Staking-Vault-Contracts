<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Digital Life DEX</title>
  <meta name="theme-color" content="#0A0F14" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00C8FF;
      --electric-cyan: #00A4CC;
      --card-bg: #0E1B2A;
      --primary-text: #E6F3FF;
      --secondary-text: #9BB3C9;
      --font-header: 'Orbitron', 'Roboto', sans-serif;
      --font-body: 'Roboto', sans-serif;
    }
    html,body{margin:0;font-family:var(--font-body);background:linear-gradient(135deg,#0A0F14 0%,#1A1F26 100%);color:var(--primary-text)}
    header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:#11151b;border-bottom:2px solid var(--neon-blue)}
    .logo{font-family:var(--font-header);color:var(--neon-blue);font-size:1.25rem}
    main{max-width:1100px;margin:2rem auto;padding:0 1rem}
    .glass-card{background:var(--card-bg);border:1.5px solid #4FD4FF;border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 0 18px #00C8FF22}
    .muted{color:var(--secondary-text)}
    .stake-row{display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap}
    .token-logo img{width:28px;height:28px;border-radius:50%}
    .muted-small{color:var(--secondary-text);font-size:0.9rem}
    button{cursor:pointer}
    @media (max-width:600px){.stake-row{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <header>
    <div class="logo">🪙 Digital Life DEX</div>
    <div>
      <button id="connectWallet">Connect Wallet</button>
    </div>
  </header>

  <main>
    <div class="glass-card">
      <h3 class="muted">Stake</h3>

      <div class="stake-row" style="margin-bottom:0.5rem">
        <label class="muted-small" for="stakeToken">Token</label>
        <select id="stakeToken"></select>
        <div class="muted-small">Balance: <strong id="selectedTokenBalance">0.0000</strong></div>
        <div class="muted-small">Price: <strong id="selectedTokenPrice">N/A</strong></div>
        <div class="muted-small">USD: <strong id="selectedTokenUsd">N/A</strong></div>
      </div>

      <div class="stake-row" style="margin-bottom:0.6rem">
        <label class="muted-small">Amount</label>
        <input id="stakeAmount" type="number" min="0" step="any" style="padding:6px;border-radius:6px">
        <label class="muted-small">Duration</label>
        <select id="lockDuration" style="padding:6px;border-radius:6px">
          <option value="30">30 days</option>
          <option value="60">60 days</option>
          <option value="90">90 days</option>
        </select>
        <input id="referrerAddress" placeholder="Referrer (optional)" style="padding:6px;border-radius:6px;width:220px">
        <button id="stakeBtn">Stake</button>
      </div>

      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <div class="muted-small">Allowance to vault: <strong id="allowanceValue">—</strong></div>
        <button id="revokeBtn">Revoke</button>
        <div class="muted-small">Pending rewards: <strong id="pendingRewards">—</strong></div>
        <div class="muted-small">Estimated APY: <strong id="apyDisplay">—</strong></div>
      </div>
    </div>

    <div class="glass-card">
      <h3 class="muted">My Stakes</h3>
      <div id="stakesGrid" class="muted">Loading...</div>
    </div>

    <div class="glass-card">
      <h3 class="muted">Recent Activity</h3>
      <div id="txList" class="muted">Loading...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
  <script>
    // CONFIG
    const RPC_URL = "https://monad-mainnet.g.alchemy.com/v2/Uwb7T0DbXMQHjiJBNf9_b005qYjLmJqk";
    const VAULT_V2_PROXY = "0x327DCaEf4E51337ABcb10c2712517429e47Fef0f";
    const WMON_ADDRESS = "0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A";
    const USDC_ADDRESS = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603";
    const BITCOINFLASH_ADDRESS = "0x7d7E0112d2763c98238aF7cebEAe33d53F3F76DD";
    const THIRDWEB_CLIENT_ID = "BM_xtlDAKQnuJR2-_N6dQuVvkSP7TTIglL1ho47LG7DP_ZbJT1HftQJ7F0RCoA0HvZKRfMeyRfwgJmZYgM-ZVSs";
    const SECONDS_PER_YEAR = 365 * 24 * 60 * 60;

    const TOKEN_LOGOS = {
      [WMON_ADDRESS.toLowerCase()]: "https://files.catbox.moe/hwlhih.png",
      // Updated USDC logo as requested
      [USDC_ADDRESS.toLowerCase()]: "https://files.catbox.moe/ujzf30.gif",
      [BITCOINFLASH_ADDRESS.toLowerCase()]: "https://files.catbox.moe/lk7mrk.png"
    };

    // ABIs (fixed / trimmed to what's used)
    const ERC20_FULL_ABI = [
      {"constant":true,"inputs":[],"name":"name","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[],"name":"symbol","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[],"name":"decimals","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[{"internalType":"address","name":"owner","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[{"internalType":"address","name":"owner","type":"address"},{"internalType":"address","name":"spender","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"constant":false,"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"from","type":"address"},{"indexed":true,"internalType":"address","name":"to","type":"address"},{"indexed":false,"internalType":"uint256","name":"value","type":"uint256"}],"name":"Transfer","type":"event"}
    ];

    const WMON_ABI = [
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"dst","type":"address"},{"indexed":false,"internalType":"uint256","name":"wad","type":"uint256"}],"name":"Deposit","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"src","type":"address"},{"indexed":true,"internalType":"address","name":"dst","type":"address"},{"indexed":false,"internalType":"uint256","name":"wad","type":"uint256"}],"name":"Transfer","type":"event"},
      {"constant":true,"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"constant":true,"inputs":[],"name":"decimals","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},
      {"constant":false,"inputs":[],"name":"deposit","outputs":[],"stateMutability":"payable","type":"function"},
      {"constant":false,"inputs":[{"internalType":"uint256","name":"wad","type":"uint256"}],"name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"constant":false,"inputs":[{"internalType":"address","name":"guy","type":"address"},{"internalType":"uint256","name":"wad","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"constant":true,"inputs":[{"internalType":"address","name":"owner","type":"address"},{"internalType":"address","name":"spender","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
    ];

    const BITCOINFLASH_ABI = [
      {"inputs":[],"stateMutability":"nonpayable","type":"constructor"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"owner","type":"address"},{"indexed":true,"internalType":"address","name":"spender","type":"address"},{"indexed":false,"internalType":"uint256","name":"value","type":"uint256"}],"name":"Approval","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"previousOwner","type":"address"},{"indexed":true,"internalType":"address","name":"newOwner","type":"address"}],"name":"OwnershipTransferred","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"from","type":"address"},{"indexed":true,"internalType":"address","name":"to","type":"address"},{"indexed":false,"internalType":"uint256","name":"value","type":"uint256"}],"name":"Transfer","type":"event"},
      {"inputs":[{"internalType":"address","name":"owner","type":"address"},{"internalType":"address","name":"spender","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"burn","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"decimals","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"subtractedValue","type":"uint256"}],"name":"decreaseAllowance","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"addedValue","type":"uint256"}],"name":"increaseAllowance","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"mint","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[],"name":"name","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"symbol","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
      {"inputs":[],"name":"totalSupply","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"transfer","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"from","type":"address"},{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"transferFrom","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
    ];

    // Trimmed/fixed vault ABI (only functions/events used by the UI)
    const VAULT_ABI = [
      {"inputs":[],"name":"getSupportedTokens","outputs":[{"internalType":"address[]","name":"","type":"address[]"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserStakes","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"user","type":"address"},{"internalType":"uint256","name":"stakeId","type":"uint256"}],"name":"getStakeInfo","outputs":[{"internalType":"address","name":"token","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"uint256","name":"stakedAt","type":"uint256"},{"internalType":"uint256","name":"unlockTime","type":"uint256"},{"internalType":"bool","name":"withdrawn","type":"bool"},{"internalType":"bool","name":"canWithdraw","type":"bool"}],"stateMutability":"view","type":"function"},
      {"inputs":[{"internalType":"address","name":"token","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"uint256","name":"duration","type":"uint256"}],"name":"stake","outputs":[{"internalType":"uint256","name":"stakeId","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"uint256","name":"stakeId","type":"uint256"}],"name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
      {"inputs":[{"internalType":"address","name":"token","type":"address"}],"name":"totalStaked","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":true,"internalType":"uint256","name":"stakeId","type":"uint256"},{"indexed":true,"internalType":"address","name":"token","type":"address"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"unlockTime","type":"uint256"}],"name":"TokenStaked","type":"event"},
      {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"user","type":"address"},{"indexed":true,"internalType":"uint256","name":"stakeId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"StakeWithdrawn","type":"event"}
    ];

    // TOKEN ABIs mapping
    const TOKEN_ABIS = {
      [WMON_ADDRESS.toLowerCase()]: WMON_ABI,
      [USDC_ADDRESS.toLowerCase()]: ERC20_FULL_ABI,
      [BITCOINFLASH_ADDRESS.toLowerCase()]: BITCOINFLASH_ABI
    };

    function createTokenContract(address, providerOrSigner){
      const addr = address.toLowerCase();
      const abi = TOKEN_ABIS[addr] || ERC20_FULL_ABI;
      return new ethers.Contract(address, abi, providerOrSigner);
    }

    // runtime
    let provider = null, signer = null, userAddress = null, vault = null, rpcProvider = null;

    // UI elements
    const el = {
      connectBtn: document.getElementById('connectWallet'),
      stakeToken: document.getElementById('stakeToken'),
      selectedTokenBalance: document.getElementById('selectedTokenBalance'),
      selectedTokenPrice: document.getElementById('selectedTokenPrice'),
      selectedTokenUsd: document.getElementById('selectedTokenUsd'),
      allowanceValue: document.getElementById('allowanceValue'),
      revokeBtn: document.getElementById('revokeBtn'),
      pendingRewards: document.getElementById('pendingRewards'),
      apyDisplay: document.getElementById('apyDisplay'),
      stakeBtn: document.getElementById('stakeBtn'),
      stakeAmount: document.getElementById('stakeAmount'),
      lockDuration: document.getElementById('lockDuration'),
      referrerAddress: document.getElementById('referrerAddress'),
      stakesGrid: document.getElementById('stakesGrid'),
      txList: document.getElementById('txList')
    };

    // helpers
    function shortAddr(a){ return a ? a.slice(0,6)+'...'+a.slice(-4) : ''; }
    function addActivity(title, desc){ const n = document.createElement('div'); n.style.padding='6px 0'; n.innerHTML = `<div style="font-weight:600">${title}</div><div class="muted-small">${desc}</div>`; el.txList.insertBefore(n, el.txList.firstChild); while(el.txList.children.length>20) el.txList.removeChild(el.txList.lastChild); }

    // Connect wallet (basic metamask)
    async function connectWallet(){
      try {
        if (!window.ethereum) throw new Error('No injected wallet');
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        rpcProvider = new ethers.JsonRpcProvider(RPC_URL);
        vault = new ethers.Contract(VAULT_V2_PROXY, VAULT_ABI, signer);
        el.connectBtn.textContent = '✅ ' + shortAddr(userAddress);
        addActivity('Connected', shortAddr(userAddress));
        await onAfterConnect();
      } catch(err){
        console.error(err);
        alert('Connect failed: ' + (err.message || err));
      }
    }

    async function onAfterConnect(){
      try {
        await populateTokenSelector();
        await updateSelectedTokenBalance();
        await updateSelectedTokenPrice();
        await showAllowanceInfo();
        await updateUserStakes();
        await fetchUserTransactions();
        await fetchRewardsAndApy();
        // periodic refresh
        setInterval(()=>{ if (userAddress) Promise.allSettled([updateSelectedTokenBalance(), updateSelectedTokenPrice(), showAllowanceInfo(), updateUserStakes(), fetchUserTransactions(), fetchRewardsAndApy()]); }, 20000);
      } catch(e){ console.warn('post-connect tasks failed', e); }
    }

    // Populate token selector from vault.getSupportedTokens (fallback to known)
    async function populateTokenSelector(){
      el.stakeToken.innerHTML = '';
      try {
        const rpc = rpcProvider || new ethers.JsonRpcProvider(RPC_URL);
        const vaultRpc = new ethers.Contract(VAULT_V2_PROXY, VAULT_ABI, rpc);
        const supported = await vaultRpc.getSupportedTokens().catch(()=>null);
        const tokens = (supported && supported.length) ? supported.map(a=>a.toLowerCase()) : [WMON_ADDRESS.toLowerCase(), USDC_ADDRESS.toLowerCase(), BITCOINFLASH_ADDRESS.toLowerCase()];
        const unique = Array.from(new Set(tokens));
        for (const t of unique){
          const opt = document.createElement('option');
          opt.value = t;
          try{
            const token = createTokenContract(t, rpc);
            opt.textContent = await token.symbol().catch(()=>t.slice(0,6));
          }catch(e){ opt.textContent = t.slice(0,8) }
          el.stakeToken.appendChild(opt);
        }
        // default WMON if present
        const w = WMON_ADDRESS.toLowerCase();
        if (Array.from(el.stakeToken.options).some(o=>o.value===w)) el.stakeToken.value = w;
        el.stakeToken.dispatchEvent(new Event('change'));
      } catch(e){
        console.warn('populateTokenSelector failed', e);
      }
    }

    // Update selected token balance
    async function updateSelectedTokenBalance(){
      const addr = el.stakeToken.value;
      if (!addr){ el.selectedTokenBalance.textContent = '0.0000'; return; }
      if (!userAddress){ el.selectedTokenBalance.textContent = '0.0000'; return; }
      try {
        const rpc = rpcProvider || new ethers.JsonRpcProvider(RPC_URL);
        const token = createTokenContract(addr, rpc);
        const dec = await token.decimals().catch(()=>18);
        const bal = await token.balanceOf(userAddress);
        el.selectedTokenBalance.textContent = parseFloat(ethers.formatUnits(bal, dec)).toFixed(4);
      } catch(e){ console.warn('updateSelectedTokenBalance', e); el.selectedTokenBalance.textContent = '0.0000' }
    }

    // Price (DexScreener best-effort)
    async function updateSelectedTokenPrice(){
      const addr = el.stakeToken.value;
      const pEl = el.selectedTokenPrice, vEl = el.selectedTokenUsd;
      if (!addr){ pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
      pEl.textContent='Loading...'; vEl.textContent='Loading...';
      try {
        const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`).catch(()=>null);
        const json = res ? await res.json().catch(()=>null) : null;
        const price = json && json.pairs && json.pairs[0] ? Number(json.pairs[0].priceUsd) : null;
        if (!price){ pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
        pEl.textContent = `$${price.toFixed(6)}`;
        const bal = Number(el.selectedTokenBalance.textContent) || 0;
        vEl.textContent = `$${(bal * price).toFixed(4)}`;
      } catch(e){ console.warn('updateSelectedTokenPrice', e); pEl.textContent='N/A'; vEl.textContent='N/A' }
    }

    // Show allowance and allow revoke
    async function showAllowanceInfo(){
      const addr = el.stakeToken.value;
      el.allowanceValue.textContent = '—';
      el.revokeBtn.disabled = true;
      if (!addr || !userAddress) { el.allowanceValue.textContent = 'Connect wallet'; return; }
      try {
        const rpc = rpcProvider || new ethers.JsonRpcProvider(RPC_URL);
        const token = createTokenContract(addr, rpc);
        const dec = await token.decimals().catch(()=>18);
        const allowance = await token.allowance(userAddress, VAULT_V2_PROXY).catch(()=>0n);
        el.allowanceValue.textContent = parseFloat(ethers.formatUnits(allowance, dec)).toFixed(4);
        el.revokeBtn.disabled = false;
        el.revokeBtn.onclick = async () => {
          if (!signer){ alert('Connect wallet'); return; }
          try {
            el.revokeBtn.disabled = true;
            addActivity('Revoke', 'Waiting for approval transaction');
            const tk = createTokenContract(addr, signer);
            const tx = await tk.approve(VAULT_V2_PROXY, 0);
            await tx.wait();
            addActivity('Revoke', 'Allowance set to 0');
            await showAllowanceInfo();
          } catch(e){ console.error('revoke error', e); alert('Revoke failed: '+(e.message||e)); el.revokeBtn.disabled = false }
        };
      } catch(e){ console.warn('showAllowanceInfo', e); el.allowanceValue.textContent = 'N/A' }
    }

    // Stake flow
    async function stakeTokens(){
      if (!vault || !signer || !userAddress){ alert('Connect wallet'); return; }
      const amountRaw = el.stakeAmount.value;
      const durationDays = el.lockDuration.value;
      const tokenAddress = el.stakeToken.value;
      if (!amountRaw || Number(amountRaw) <= 0){ alert('Enter valid amount'); return; }
      try {
        addActivity('Staking','Preparing transaction');
        const token = createTokenContract(tokenAddress, signer);
        const decimals = await token.decimals().catch(()=>18);
        const amountWei = ethers.parseUnits(String(amountRaw), decimals);
        const durationSec = Number(durationDays) * 24 * 60 * 60;

        // approve if needed
        const allowance = await token.allowance(userAddress, VAULT_V2_PROXY).catch(()=>0n);
        if (allowance < amountWei){
          addActivity('Approving', 'Please confirm approve in wallet');
          const txA = await token.approve(VAULT_V2_PROXY, amountWei);
          await txA.wait();
        }

        addActivity('Staking', 'Sending stake tx');
        const tx = await vault.connect(signer).stake(tokenAddress, amountWei, durationSec);
        await tx.wait();
        addActivity('Staked', 'Stake confirmed');
        await Promise.allSettled([ updateSelectedTokenBalance(), updateUserStakes(), showAllowanceInfo(), fetchRewardsAndApy(), fetchUserTransactions() ]);
      } catch(e){ console.error('stakeTokens', e); alert('Stake failed: ' + (e.message||e)) }
    }

    // Fetch user stakes
    async function updateUserStakes(){
      el.stakesGrid.textContent = 'Loading...';
      if (!vault || !userAddress){ el.stakesGrid.textContent = 'Connect wallet to view stakes'; return; }
      try {
        const ids = await vault.getUserStakes(userAddress);
        if (!ids || ids.length === 0){ el.stakesGrid.innerHTML = '<div class="muted">No stakes</div>'; return; }
        const rpc = rpcProvider || new ethers.JsonRpcProvider(RPC_URL);
        const rows = [];
        for (const id of ids){
          try {
            const idStr = id.toString();
            const info = await vault.getStakeInfo(userAddress, id);
            // info: token, amount, stakedAt, unlockTime, withdrawn, canWithdraw
            const tokenAddr = (info.token || WMON_ADDRESS).toLowerCase();
            const token = createTokenContract(tokenAddr, rpc);
            const dec = await token.decimals().catch(()=>18);
            const symbol = await token.symbol().catch(()=>tokenAddr.slice(0,6));
            const amount = parseFloat(ethers.formatUnits(info.amount || 0n, dec)).toFixed(4);
            const unlock = info.unlockTime ? new Date(Number(info.unlockTime)*1000).toLocaleString() : 'N/A';
            const locked = info.canWithdraw === false;
            rows.push(`<div style="display:flex;align-items:center;gap:0.6rem;padding:8px 0;border-top:1px solid rgba(255,255,255,0.02)"><div class="token-logo"><img src="${TOKEN_LOGOS[tokenAddr] || ''}" onerror="this.style.display='none'"></div><div><div style="font-weight:700">${amount} ${symbol}</div><div class="muted-small">Stake #${idStr} • Unlock: ${unlock}</div></div><div style="margin-left:auto"><button ${locked ? 'disabled' : ''} onclick="withdrawStake('${idStr}')">${locked ? '🔒 LOCKED' : 'Withdraw'}</button></div></div>`);
          } catch(e){ console.warn('getStakeInfo failed', e) }
        }
        el.stakesGrid.innerHTML = rows.join('') || '<div class="muted">No stakes</div>';
      } catch(e){ console.error('updateUserStakes', e); el.stakesGrid.textContent = 'Failed to load stakes' }
    }

    // Withdraw
    async function withdrawStake(stakeId){
      if (!vault || !signer){ alert('Connect wallet'); return; }
      try {
        addActivity('Withdraw', 'Confirm withdraw in wallet');
        // convert to BigInt for ethers if needed
        const idBn = BigInt(stakeId);
        const tx = await vault.connect(signer).withdraw(idBn);
        await tx.wait();
        addActivity('Withdrawn', `Stake #${stakeId} withdrawn`);
        await Promise.allSettled([ updateUserStakes(), fetchUserTransactions(), fetchRewardsAndApy() ]);
      } catch(e){ console.error('withdrawStake', e); alert('Withdraw failed: ' + (e.message||e)) }
    }

    // Transaction history (insight / thirdweb)
    async function fetchUserTransactions(limit = 6){
      el.txList.textContent = 'Loading...';
      if (!userAddress){ el.txList.textContent = 'Connect wallet to see transactions'; return; }
      try {
        const tokens = [WMON_ADDRESS.toLowerCase(), USDC_ADDRESS.toLowerCase(), BITCOINFLASH_ADDRESS.toLowerCase()];
        const base = `https://143.insight.thirdweb.com/v1/events`;
        const qs = tokens.map(addr => fetch(`${base}?limit=${limit}&contract=${addr}&event=Transfer(address,address,uint256)`, { headers: { "x-client-id": THIRDWEB_CLIENT_ID } }).then(r => r.ok ? r.json() : Promise.reject(r.statusText)).catch(()=>null));
        const results = await Promise.all(qs);
        el.txList.innerHTML = '';
        let any=false;
        for (const res of results){
          if (!res || !res.events) continue;
          for (const ev of res.events.slice(0,limit)){
            any=true;
            const from = ev.payload?.from || '';
            const to = ev.payload?.to || '';
            const val = ev.payload?.value || '';
            addActivity('Transfer ' + val, `${from} → ${to}`);
          }
        }
        if (!any) el.txList.innerHTML = '<div class="muted">No recent transfers</div>';
      } catch(e){ console.warn('fetchUserTransactions', e); el.txList.textContent = 'Transaction history unavailable' }
    }

    // Rewards & APY: try common function names, fall back to estimation
    async function fetchRewardsAndApy(){
      // pending rewards
      el.pendingRewards.textContent = '—';
      el.apyDisplay.textContent = '—';
      if (!vault || !userAddress) return;
      try {
        // Attempt known pending reward function names (best-effort)
        const pendingFns = ['calculateRewards','pendingRewards','pendingReward','earned','rewardsOf','pending'];
        let pending = null;
        for (const fn of pendingFns){
          if (vault[fn]) {
            try { pending = await vault[fn](userAddress); break; } catch(e){ /* continue */ }
          }
        }
        if (pending == null) {
          el.pendingRewards.textContent = 'N/A';
        } else {
          const formatted = parseFloat(ethers.formatUnits(pending, 18)).toFixed(6);
          el.pendingRewards.textContent = `${formatted}`;
        }
      } catch(e){ console.warn('fetchPendingRewards failed', e); el.pendingRewards.textContent = 'N/A' }

      // Try to compute APY
      try {
        const rateFns = ['rewardRate','rewardPerSecond','rewardsPerSecond','rewardRatePerSecond'];
        let rate = null;
        for (const fn of rateFns){
          if (vault[fn]) {
            try { rate = await vault[fn](); break; } catch(e){ /* continue */ }
          }
        }

        const tokenAddr = el.stakeToken.value;
        let totalStaked = null;
        if (vault.totalStaked && tokenAddr) {
          try { totalStaked = await vault.totalStaked(tokenAddr).catch(()=>null); } catch(e){ totalStaked = null; }
        }

        if (rate && totalStaked && totalStaked > 0n) {
          const rateNum = Number(rate.toString());
          const totalNum = Number(totalStaked.toString());
          const apy = (rateNum * SECONDS_PER_YEAR / totalNum) * 100;
          el.apyDisplay.textContent = `${apy.toFixed(2)}% (est)`;
        } else {
          el.apyDisplay.textContent = 'N/A';
        }
      } catch(e){ console.warn('fetchAPY failed', e); el.apyDisplay.textContent = 'N/A' }
    }

    // Live DEX data (TVL etc.)
    async function fetchLiveDexData(){
      try {
        const rpc = rpcProvider || new ethers.JsonRpcProvider(RPC_URL);
        const vaultRpc = new ethers.Contract(VAULT_V2_PROXY, VAULT_ABI, rpc);
        const tokens = await vaultRpc.getSupportedTokens().catch(()=>[WMON_ADDRESS,USDC_ADDRESS,BITCOINFLASH_ADDRESS]);
        const tokenData = await Promise.all(tokens.map(async a=>{
          try {
            const addr = a.toLowerCase();
            const t = createTokenContract(addr, rpc);
            const dec = await t.decimals().catch(()=>18);
            const sym = await t.symbol().catch(()=>addr.slice(0,6));
            const raw = await vaultRpc.totalStaked(addr).catch(()=>0n);
            const tvl = parseFloat(ethers.formatUnits(raw, dec)).toFixed(2);
            return {address:addr,symbol:sym,tvl,logo:TOKEN_LOGOS[addr]||null};
          } catch(e){ return null }
        }));
        return tokenData.filter(Boolean);
      } catch(e){ console.warn('fetchLiveDexData', e); return [] }
    }

    // event wiring
    el.connectBtn.addEventListener('click', () => { if (!userAddress) connectWallet(); else { userAddress=null; el.connectBtn.textContent='Connect Wallet'; addActivity('Disconnected','Logged out'); }});
    el.stakeBtn.addEventListener('click', stakeTokens);
    el.stakeToken.addEventListener('change', async () => { await updateSelectedTokenBalance(); await updateSelectedTokenPrice(); await showAllowanceInfo(); await fetchRewardsAndApy(); });

    // expose for debugging
    window._dex = { connectWallet, populateTokenSelector, updateSelectedTokenBalance, updateSelectedTokenPrice, showAllowanceInfo, stakeTokens, updateUserStakes, fetchUserTransactions, fetchRewardsAndApy, fetchLiveDexData };

    // initial population (best-effort)
    (async function init(){
      try {
        rpcProvider = new ethers.JsonRpcProvider(RPC_URL);
        await populateTokenSelector();
        await fetchLiveDexData();
      } catch(e){ console.warn('init failed', e) }
    })();
  </script>
</body>
</html>
