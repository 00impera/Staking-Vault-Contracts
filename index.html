    .container{max-width:1200px;margin:40px auto;padding:28px}
    header{display:flex;align-items:center;justify-content:space-between}
    .logo{width:56px;height:56px;border-radius:12px;background:var(--cosmic-blue);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a0c1a}
    .card,.glass-card{background:var(--card);border-radius:18px;padding:22px;margin-top:20px}
    .muted{color:var(--muted)}
    .btn{background:var(--cosmic-blue);color:#fff;padding:10px 18px;border-radius:12px;border:0;cursor:pointer}
    .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .small{font-size:0.9rem;color:var(--muted)}
    select,input {padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:#0d1117;color:var(--text)}
    .muted-small{color:var(--muted);font-size:0.9rem}
    pre.debug { background:#071024;color:#bfefff;padding:12px;border-radius:12px;overflow:auto;max-height:320px;margin-top:12px;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Segoe UI Mono", monospace; white-space:pre-wrap }
    /* Debug console color classes (neon / mythic) */
    .debug-line{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px;margin-bottom:6px}
    .log-timestamp{color:#7f8caa;font-size:0.82rem;min-width:110px}
    .log-tag{font-weight:700;font-size:0.9rem}
    .log-info{color:#5fd0ff}
    .log-success{color:#7efc9a}
    .log-warn{color:#ffd36a}
    .log-error{color:#ff7b7b}
    .log-module{color:#c17cff}
    .debug-controls{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:8px}
    .debug-controls button{padding:6px 10px;border-radius:8px;border:0;cursor:pointer;background:rgba(255,255,255,0.04);color:var(--muted)}
    .debug-controls .danger{background:linear-gradient(90deg,#ff5a5a,#ff8a5a);color:#081018}
    .address-copy{cursor:pointer;text-decoration:underline dotted;opacity:0.85}
    /* small responsive tweaks */
    @media (max-width:880px){ .container{padding:16px;margin:18px auto} header{flex-direction:column;align-items:flex-start;gap:12px} }

  <script>

    {"inputs":[{"internalType":"address","name":"newImplementation","type":"address"},{"internalType":"bytes","name":"data","type":"bytes"}],"name":"upgradeToAndCall","outputs":[],"stateMutability":"payable","type":"function"}
  ];

  // Fallback/general minimal ERC20 ABI used for tokens we don't have explicit ABIs for
  const ERC20_FULL_ABI = [
    {"constant":true,"inputs":[],"name":"symbol","outputs":[{"name":"","type":"string"}],"type":"function"},

  const TOKEN_ABIS = {

  function createTokenContract(address, providerOrSigner) {

  // === Styled debug console helpers ===
  function ensureDebugVisible() {
    if (ui.debugPanel) ui.debugPanel.style.display = 'block';
  }
  function hideDebug() {
    if (ui.debugPanel) ui.debugPanel.style.display = 'none';
  }
  function clearDebug() {
    if (ui.debugLog) ui.debugLog.innerHTML = '';
  }
  if (ui.debugClearBtn) ui.debugClearBtn.onclick = clearDebug;
  if (ui.debugToggleBtn) ui.debugToggleBtn.onclick = () => { if (ui.debugPanel.style.display === 'none') { ensureDebugVisible(); ui.debugToggleBtn.textContent = 'Hide'; } else { hideDebug(); ui.debugToggleBtn.textContent = 'Show'; } };

  function appendDebugLine(level, tag, message) {
    try {
      if (!ui.debugLog) return;
      ensureDebugVisible();
      const line = document.createElement('div');
      line.className = 'debug-line';
      const ts = document.createElement('div');
      ts.className = 'log-timestamp';
      ts.textContent = new Date().toLocaleTimeString();
      const tagEl = document.createElement('div');
      tagEl.className = 'log-tag';
      tagEl.textContent = `[${(tag||'LOG').toUpperCase()}]`;
      // color class
      const colorClass = level === 'error' ? 'log-error' : level === 'warn' ? 'log-warn' : level === 'success' ? 'log-success' : level === 'module' ? 'log-module' : 'log-info';
      tagEl.classList.add(colorClass);
      const msg = document.createElement('div');
      msg.style.whiteSpace = 'pre-wrap';
      msg.textContent = String(message);
      line.appendChild(ts);
      line.appendChild(tagEl);
      line.appendChild(msg);
      ui.debugLog.appendChild(line);
      ui.debugLog.scrollTop = ui.debugLog.scrollHeight;
    } catch (e) { console.log('appendDebugLine failed', e); }
  }

  // Generic log wrapper used across the app. Detects severity based on text / keywords.
  function log(...args) {
    // Mirror to browser console
    try { console.log(...args); } catch(e){}
    try {
      const text = args.map(a => {
        if (a === null) return 'null';
        if (typeof a === 'string') return a;
        try { return (a && a.stack) ? a.stack : JSON.stringify(a, null, 2); } catch(e){ return String(a); }
      }).join(' ');
      // determine level by heuristics
      const lower = text.toLowerCase();
      let level = 'info';
      if (lower.includes('error') || lower.includes('failed') || lower.includes('unhandledrejection') || lower.includes('exception')) level = 'error';
      else if (lower.includes('warn')) level = 'warn';
      else if (lower.includes('success') || lower.includes('confirmed') || lower.includes('connected')) level = 'success';
      else if (lower.includes('debug') || lower.includes('module')) level = 'module';
      appendDebugLine(level, (args[0] && typeof args[0] === 'string' ? args[0].split(' ')[0].replace(/[:]/g,'') : 'LOG'), text);
    } catch (e) {
      try { appendDebugLine('error','log','Failed to render debug line: ' + e.message); } catch(e){}
    }
  }
  function showDebugPanel(){ if (ui.debugPanel) ui.debugPanel.style.display = 'block'; }

  window.addEventListener('unhandledrejection', (ev) => { log('UnhandledRejection:', ev.reason); showDebugPanel(); });

  // === Web3Auth initialization with fallback to injected wallet ===
  async function initWeb3Auth() {
    ui.connectBtn.disabled = true;
    ui.connectBtn.textContent = 'Initializing...';
    try {
      // Try to detect Web3Auth UMD export more robustly
      const Web3AuthCandidates = [
        () => (window.Web3AuthModal && window.Web3AuthModal.Web3Auth),
        () => window.Web3Auth,
        () => (window.Web3AuthModal && window.Web3AuthModal.default && window.Web3AuthModal.default.Web3Auth),
        () => (window.Web3Auth && window.Web3Auth.default && window.Web3Auth.default.Web3Auth)
      ];
      let Web3AuthConstructor = null;
      for (const fn of Web3AuthCandidates) {
        try { const c = fn(); if (c) { Web3AuthConstructor = c; break; } } catch(e){}
      }
      if (!Web3AuthConstructor) {
        const msg = 'Web3Auth modal library not found. Falling back to injected wallet (MetaMask) if available.';
        console.warn(msg);
        log(msg);
        showDebugPanel();
        ui.connectBtn.disabled = false;
        ui.connectBtn.textContent = 'Connect (Injected)';
        ui.connectBtn.onclick = connectInjectedWallet;
        return;
      }

      web3auth = new Web3AuthConstructor({
        clientId: WEB3AUTH_CLIENT_ID,
        chainConfig: {
          chainNamespace: CHAIN.chainNamespace,
          chainId: CHAIN.chainIdHex,
          rpcTarget: CHAIN.rpcTarget,
          displayName: CHAIN.displayName,
          blockExplorer: CHAIN.blockExplorer,
          ticker: CHAIN.ticker,
          tickerName: CHAIN.tickerName
        },
        web3AuthNetwork: "mainnet"
      });

      await web3auth.initModal();
      log('Web3Auth', 'initModal finished');
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connect (Web3Auth)';
      ui.connectBtn.onclick = () => connectWeb3Auth();

      // If an existing session/provider is present, connect automatically
      if (web3auth.provider) {
        log('Web3Auth', 'Auto-connecting with existing Web3Auth session');
        await connectWeb3Auth(true);
      }
    } catch (err) {
      console.error('initWeb3Auth error', err);
      log('initWeb3Auth error: ' + (err.message || err));
      showDebugPanel();
      // fallback to injected
      ui.connectBtn.disabled = false;
      ui.connectBtn.textContent = 'Connect (Injected)';
      ui.connectBtn.onclick = connectInjectedWallet;
    }
  }

  // Connect via Web3Auth (if available)
  async function connectWeb3Auth(isAuto=false) {
    try {
      if (!web3auth) throw new Error('Web3Auth not initialized');
      // hygiene: Web3Auth requires HTTPS or localhost
      const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!isSecure && !isAuto) {
        const w = 'Web3Auth requires HTTPS or localhost. Serve over http://localhost or HTTPS.';
        log('Web3Auth', w); alert(w); showDebugPanel(); return;
      }
      ui.connectBtn.disabled = true; ui.connectBtn.textContent = 'Connecting...';
      walletProvider = await web3auth.connect(); // may open modal
      if (!walletProvider) throw new Error('No provider returned from web3auth.connect()');
      ethersProvider = new ethers.providers.Web3Provider(walletProvider);
      signer = ethersProvider.getSigner();
      currentAddress = (await signer.getAddress()).toLowerCase();
      ui.address.textContent = 'Connected: ' + currentAddress;
      ui.address.title = 'Click to copy address';
      vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, signer);
      await afterWalletConnected();
      ui.connectBtn.disabled = false; ui.connectBtn.textContent = 'Connected';
    } catch (err) {
      console.error('connectWeb3Auth error', err);
      log('connectWeb3Auth error: ' + (err.message || err));
      showDebugPanel();
      ui.connectBtn.disabled = false; ui.connectBtn.textContent = 'Connect';
      alert('Connect failed: ' + (err.message || err));
    }
  }

    try {

        alert(msg); log(msg); showDebugPanel(); return;
      }
      ui.connectBtn.disabled = true; ui.connectBtn.textContent = 'Connecting (Injected)...';
      await window.ethereum.request({ method: 'eth_requestAccounts' });
      walletProvider = window.ethereum;
      ethersProvider = new ethers.providers.Web3Provider(window.ethereum);
      signer = ethersProvider.getSigner();
      currentAddress = (await signer.getAddress()).toLowerCase();
      ui.address.textContent = 'Connected: ' + currentAddress;
      ui.address.title = 'Click to copy address';
      vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, signer);
      await afterWalletConnected();
      ui.connectBtn.disabled = false; ui.connectBtn.textContent = 'Connected (Injected)';
    } catch (err) {
      console.error('connectInjectedWallet error', err);
      log('connectInjectedWallet error: ' + (err.message || err));
      showDebugPanel();
      ui.connectBtn.disabled = false; ui.connectBtn.textContent = 'Connect (Injected)';
      alert('Injected connect failed: ' + (err.message || err));
    }
  }

  // copy address on click
  if (ui.address) ui.address.onclick = async () => { if (currentAddress) { try { await navigator.clipboard.writeText(currentAddress); log('Clipboard','Copied address to clipboard'); } catch(e){ log('Clipboard error', e); } } };

  // === Post-connect logic (token loading, balances, allowances, staking) ===
  async function afterWalletConnected() {
    log('afterWalletConnected', 'start');
    try {
      await loadSupportedTokens();
      await loadUserBalance();
      await loadAllowance();
      await loadPendingRewards();
      await loadAPY();
      await loadUserStakes();
      await loadRecentActivity();
      await loadReferrerRewards();
      log('afterWalletConnected', 'completed');
    } catch (e) {
      console.warn('afterWalletConnected failed', e);
      log('afterWalletConnected failed: ' + (e.message || e));
      showDebugPanel();
    }
  }

  async function loadSupportedTokens() {
    log('loadSupportedTokens');
    try {
      // Use a read-only provider against the proxy; note: if the proxy doesn't expose implementation methods,
      // this will fall back to the default list below.
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const tokens = await vaultRead.getSupportedTokens?.().catch(()=>null);
      let list = tokens && tokens.length ? tokens.map(t => t.toLowerCase()) : [WMON_ADDRESS.toLowerCase(), USDC_ADDRESS.toLowerCase(), BITCOINFLASH_ADDRESS.toLowerCase()];
      ui.stakeToken.innerHTML = '';
      for (const t of list) {
        const token = createTokenContract(t, rpcFallbackProvider);
        let symbol = t.slice(0,6);
        try { symbol = await token.symbol(); } catch(e){}
        const opt = document.createElement('option'); opt.value = t; opt.textContent = symbol; ui.stakeToken.appendChild(opt);
      }
      const w = WMON_ADDRESS.toLowerCase();
      if (Array.from(ui.stakeToken.options).some(o => o.value === w)) ui.stakeToken.value = w;
      if (ui.tokensList) ui.tokensList.textContent = Array.from(ui.stakeToken.options).map(o=>o.textContent).join(', ');
      ui.stakeToken.dispatchEvent(new Event('change'));
      log('Supported tokens loaded:', list);
    } catch (e) {
      console.warn('loadSupportedTokens error', e);
      log('loadSupportedTokens error: ' + (e.message || e));
      showDebugPanel();
    }
  }

  async function loadUserBalance() {
    log('loadUserBalance');
    if (!signer || !currentAddress) return;
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const [bal, dec] = await Promise.all([ token.balanceOf(currentAddress), token.decimals().catch(()=>18) ]);
      ui.selectedTokenBalance.textContent = ethers.utils.formatUnits(bal, dec);
      await updateSelectedTokenPrice();
    } catch (e) {
      console.warn('loadUserBalance failed', e);
      log('loadUserBalance failed: ' + (e.message || e));
      ui.selectedTokenBalance.textContent = '0.0000';
    }
  }

  async function updateSelectedTokenPrice() {
    const addr = ui.stakeToken.value;
    const pEl = ui.selectedTokenPrice, vEl = ui.selectedTokenUsd;
    if (!addr) { pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
    pEl.textContent='Loading...'; vEl.textContent='Loading...';
    try {
      const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`).catch(()=>null);
      const json = res ? await res.json().catch(()=>null) : null;
      const price = json && json.pairs && json.pairs[0] ? Number(json.pairs[0].priceUsd) : null;
      if (!price){ pEl.textContent='N/A'; vEl.textContent='N/A'; return; }
      pEl.textContent = `$${price.toFixed(6)}`;
      const bal = Number(ui.selectedTokenBalance.textContent) || 0;
      vEl.textContent = `$${(bal * price).toFixed(4)}`;
    } catch(e){
      console.warn('updateSelectedTokenPrice error', e);
      log('updateSelectedTokenPrice error: ' + (e.message || e));
      pEl.textContent='N/A'; vEl.textContent='N/A';
    }
  }

  async function loadAllowance() {
    log('loadAllowance');
    if (!signer || !currentAddress) { ui.allowanceValue.textContent = 'Connect wallet'; return; }
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const dec = await token.decimals().catch(()=>18);
      const allowance = await token.allowance(currentAddress, VAULT_ADDRESS);
      ui.allowanceValue.textContent = ethers.utils.formatUnits(allowance, dec);
      ui.revokeBtn.disabled = false;
    } catch (e) {
      console.warn('loadAllowance failed', e);
      log('loadAllowance failed: ' + (e.message || e));
      ui.allowanceValue.textContent = 'N/A';
      ui.revokeBtn.disabled = true;
      showDebugPanel();
    }
  }

  async function loadPendingRewards() {
    log('loadPendingRewards');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const pendingNames = ['calculateRewards','pendingRewards','pendingReward','earned','rewardsOf','pending'];
      let pending = null;
      for (const fn of pendingNames) {
        if (vaultRead[fn]) {
          try { pending = await vaultRead[fn](currentAddress); break; } catch(e){ }
        }
      }
      ui.pendingRewards.textContent = pending ? ethers.utils.formatUnits(pending, 18) : 'N/A';
    } catch (e) {
      console.warn('loadPendingRewards failed', e);
      log('loadPendingRewards failed: ' + (e.message || e));
      ui.pendingRewards.textContent = 'N/A';
    }
  }

  async function loadAPY() {
    log('loadAPY');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const rateFns = ['rewardRate','rewardPerSecond','rewardsPerSecond','rewardRatePerSecond'];
      let rate = null;
      for (const fn of rateFns) {
        if (vaultRead[fn]) {
          try { rate = await vaultRead[fn](); break; } catch(e){}
        }
      }
      const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
      let totalStaked = null;
      try { totalStaked = await vaultRead.totalStaked(tokenAddr); } catch(e){}
      if (rate && totalStaked && totalStaked.gt(0)) {
        const SECONDS_PER_YEAR = 365 * 24 * 60 * 60;
        const rateNum = Number(rate.toString());
        const totalNum = Number(totalStaked.toString());
        const apy = (rateNum * SECONDS_PER_YEAR / totalNum) * 100;
        ui.apyDisplay.textContent = `${apy.toFixed(2)}% (est)`;
      } else {
        ui.apyDisplay.textContent = 'N/A';
      }
    } catch (e) {
      console.warn('loadAPY failed', e);
      log('loadAPY failed: ' + (e.message || e));
      ui.apyDisplay.textContent = 'N/A';
    }
  }

  async function loadUserStakes() {
    log('loadUserStakes');
    if (ui.stakesGrid) ui.stakesGrid.textContent = 'Loading...';
    if (!currentAddress) { if (ui.stakesGrid) ui.stakesGrid.textContent = 'Connect wallet to view stakes'; return; }
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const ids = await vaultRead.getUserStakes?.(currentAddress).catch(()=>[]);
      if (!ids || ids.length === 0) { if (ui.stakesGrid) ui.stakesGrid.innerHTML = '<div class="muted">No stakes</div>'; return; }
      const rows = [];
      for (const id of ids) {
        try {
          const info = await vaultRead.getStakeInfo?.(currentAddress, id);
          if (!info) continue;
          const tokenAddr = (info.token || WMON_ADDRESS).toLowerCase();
          const token = createTokenContract(tokenAddr, rpcFallbackProvider);
          const dec = await token.decimals().catch(()=>18);
          const symbol = await token.symbol().catch(()=>tokenAddr.slice(0,6));
          const amount = parseFloat(ethers.utils.formatUnits(info.amount || ethers.constants.Zero, dec)).toFixed(4);
          const unlock = info.unlockTime ? new Date(Number(info.unlockTime.toString())*1000).toLocaleString() : 'N/A';
          const locked = info.canWithdraw === false;
          const idStr = id.toString();
          rows.push(`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.03)"><div style="width:36px;height:36px;border-radius:6px;background:#0003;display:flex;align-items:center;justify-content:center">${(symbol||'T')[0]}</div><div><div style="font-weight:700">${amount} ${symbol}</div><div class="muted-small">Stake #${idStr} • Unlock: ${unlock}</div></div><div style="margin-left:auto"><button ${locked ? 'disabled' : ''} onclick="window.withdrawStake && window.withdrawStake('${idStr}')">${locked ? '🔒 LOCKED' : 'Withdraw'}</button></div></div>`);
        } catch (e) {
          console.warn('getStakeInfo failed', e);
        }
      }
      if (ui.stakesGrid) ui.stakesGrid.innerHTML = rows.join('') || '<div class="muted">No stakes</div>';
    } catch (e) {
      console.error('loadUserStakes failed', e);
      if (ui.stakesGrid) ui.stakesGrid.textContent = 'Failed to load stakes';
      log('loadUserStakes failed: ' + (e.message || e));
    }
  }

  window.withdrawStake = async function(stakeIdStr) {
    if (!vaultContract || !signer) return alert('Connect wallet first');
    try {
      log('withdrawStake', stakeIdStr);
      const bn = ethers.BigNumber.from(stakeIdStr);
      const tx = await vaultContract.withdraw(bn);
      await tx.wait();
      alert('Withdrawn stake ' + stakeIdStr);
      await Promise.all([ loadUserStakes(), loadUserBalance(), loadPendingRewards(), loadAPY(), loadRecentActivity() ]);
    } catch (e) {
      console.error('withdrawStake failed', e);
      log('withdrawStake failed: ' + (e.message || e));
      alert('Withdraw failed: ' + (e.message || e));
      showDebugPanel();
    }
  };

  async function loadRecentActivity() {
    log('loadRecentActivity');
    try {
      const provider = rpcFallbackProvider;
      const blockNum = await provider.getBlockNumber();
      const fromBlock = Math.max(0, blockNum - 5000);
      const txs = [];
      for (const addr of [WMON_ADDRESS, USDC_ADDRESS, BITCOINFLASH_ADDRESS]) {
        try {
          const token = createTokenContract(addr, provider);
          const evs = await token.queryFilter(token.filters.Transfer(), fromBlock, blockNum).catch(()=>[]);
          for (const ev of evs.slice(-6)) {
            const vals = ev.args || [];
            txs.push({title:`Transfer ${vals[2] ? vals[2].toString() : ''}`, desc:`${vals[0]||''} → ${vals[1]||''}`});
          }
        } catch (e){}
      }
      try {
        const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, provider);
        const ts = await vaultRead.queryFilter(vaultRead.filters.TokenStaked(), fromBlock, blockNum).catch(()=>[]);
        const sw = await vaultRead.queryFilter(vaultRead.filters.StakeWithdrawn(), fromBlock, blockNum).catch(()=>[]);
        for (const ev of ts.slice(-6)) { const a = ev.args||[]; txs.push({title:`Staked ${a[3] ? a[3].toString() : ''}`, desc:`${a[0]||''} • stake #${a[1] ? a[1].toString() : ''}`}); }
        for (const ev of sw.slice(-6)) { const a = ev.args||[]; txs.push({title:`Withdrawn ${a[2] ? a[2].toString() : ''}`, desc:`${a[0]||''} • stake #${a[1] ? a[1].toString() : ''}`}); }
      } catch (e){}
      if (ui.txList) ui.txList.innerHTML = '';
      if (txs.length === 0) { if (ui.txList) ui.txList.innerHTML = '<div class="muted">No recent transfers</div>'; }
      else txs.slice(-20).reverse().forEach(t => { const n = document.createElement('div'); n.style.padding='6px 0'; n.innerHTML = `<div style="font-weight:600">${t.title}</div><div class="muted-small">${t.desc}</div>`; ui.txList && ui.txList.appendChild(n); });
    } catch (e) {
      console.warn('loadRecentActivity failed', e);
      log('loadRecentActivity failed: ' + (e.message || e));
      if (ui.txList) ui.txList.textContent = 'Transaction history unavailable';
    }
  }

  async function loadReferrerRewards() {
    log('loadReferrerRewards');
    try {
      const vaultRead = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcFallbackProvider);
      const names = ['referrerRewardsOf','referrerRewards','refRewards','referralRewards'];
      let val = null;
      for (const n of names) { if (vaultRead[n]) { try { val = await vaultRead[n](currentAddress); break; } catch(e){} } }
      if (ui.refRewards) ui.refRewards.textContent = val ? ethers.utils.formatUnits(val,18) : '—';
    } catch (e) {
      console.warn('loadReferrerRewards failed', e);
      log('loadReferrerRewards failed: ' + (e.message || e));
      if (ui.refRewards) ui.refRewards.textContent = '—';
    }
  }

  // Stake / Approve / Revoke wiring
  if (ui.stakeBtn) ui.stakeBtn.addEventListener('click', async () => {
    if (!signer || !vaultContract) return alert('Connect wallet first!');
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    const amountRaw = ui.stakeAmount.value;
    const durationDays = Number(ui.lockDuration.value || 30);
    if (!amountRaw || Number(amountRaw) <= 0) return alert('Enter valid amount');
    try {
      const token = createTokenContract(tokenAddr, signer);
      const dec = await token.decimals().catch(()=>18);
      const amountWei = ethers.utils.parseUnits(String(amountRaw), dec);
      const allowance = await token.allowance(currentAddress, VAULT_ADDRESS);
      if (allowance.lt(amountWei)) {
        log('Approve', 'Approving token for vault...');
        const txA = await token.approve(VAULT_ADDRESS, amountWei);
        await txA.wait();
        log('Approve', 'Approve confirmed');
      }
      const durationSec = durationDays * 24 * 60 * 60;
      const tx = await vaultContract.stake(tokenAddr, amountWei, durationSec);
      await tx.wait();
      alert('Stake confirmed');
      await Promise.all([ loadUserBalance(), loadUserStakes(), loadAllowance(), loadPendingRewards(), loadRecentActivity() ]);
    } catch (e) {
      console.error('stake failed', e);
      log('stake failed: ' + (e.message || e));
      showDebugPanel();
      alert('Stake failed: ' + (e.message || e));
    }
  });

  if (ui.revokeBtn) ui.revokeBtn.addEventListener('click', async () => {
    if (!signer) return alert('Connect wallet first!');
    const tokenAddr = ui.stakeToken.value || WMON_ADDRESS;
    try {
      const token = createTokenContract(tokenAddr, signer);
      const tx = await token.approve(VAULT_ADDRESS, 0);
      await tx.wait();
      alert('Allowance revoked');
      await loadAllowance();
    } catch (e) {
      console.error('revoke failed', e);
      log('revoke failed: ' + (e.message || e));
      showDebugPanel();
      alert('Revoke failed: ' + (e.message || e));
    }
  });

  if (ui.stakeToken) ui.stakeToken.addEventListener('change', async () => {
    await Promise.all([ loadUserBalance(), loadAllowance(), loadPendingRewards(), loadAPY() ]);
  });

  // Boot: init Web3Auth early and populate tokens
  (async function boot() {
    try {
      await initWeb3Auth();
      await loadSupportedTokens();
    } catch (e) {
      console.error('boot/init failed', e);
      log('boot init failed: ' + (e.message || e));
      showDebugPanel();
      // ensure connect button usable (fallback to injected)
      if (!ui.connectBtn.onclick) { ui.connectBtn.disabled = false; ui.connectBtn.textContent = 'Connect (Injected)'; ui.connectBtn.onclick = connectInjectedWallet; }
    }
  })();

  console.info('Page booted. If Web3Auth modal does not open, use the injected wallet fallback or serve over HTTPS/localhost.');

  </script>
</body>
</html>
